summary: >-
  Oracle Cloud Infrastructure serves no /.well-known document on any probed host. The API
  hosts answer every /.well-known/* path with the ordinary OCI API error envelope
  ({"code":"NotAuthorizedOrNotFound"} / {"code":"NotFound"}), www.oracle.com returns a blanket
  403 to non-browser clients for the whole /.well-known/ prefix, and cloud.oracle.com answers
  /.well-known/api-catalog with HTTP 200 carrying the console single-page-app HTML shell — a
  catch-all, not a document. No WellKnown, APICatalog or SecurityTxt pointer is emitted, because
  nothing was actually served.
note: >-
  Oracle DOES publish a machine-readable catalogue of its 159 OCI service APIs, just not at a
  /.well-known path: https://docs.oracle.com/en-us/iaas/api/specs/index.json maps each service to
  its per-region endpoints and to a first-party Swagger 2.0 document under
  https://docs.oracle.com/en-us/iaas/api/specs/. That index is the source for the contracts saved
  in openapi/_original/. It is recorded here as a finding, not as a /.well-known hit.
