      x-related-resource: '#/definitions/Subscription'
      summary: Delete subscription
      x-summary-source: derived
    get:
      description: 'Gets the specified subscription''s configuration information.


        The topic API endpoint is required for this operation.

        To get the topic API endpoint, use GetTopic

        and review the `apiEndpoint` value in the response (NotificationTopic).


        Transactions Per Minute (TPM) per-tenancy limit for this operation: 60.


        For instructions, see

        Getting a Subscription''s Details.'
      operationId: GetSubscription
      parameters:
      - description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subscription to retrieve.

