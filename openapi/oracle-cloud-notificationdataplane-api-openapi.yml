        in: query
        name: endpoint
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/TokenQueryParam'
      - $ref: '#/components/parameters/ProtocolQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: Success
          headers:
