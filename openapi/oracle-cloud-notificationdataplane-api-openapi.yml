        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
      - notificationDataPlane
      x-example: 'POST /20181201/subscriptions/<var>&lt;subscription_OCID&gt;</var>/resendConfirmation

        Host: <var>&lt;topic API endpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/Subscription'
      summary: Resend subscription confirmation
      x-summary-source: derived
  /subscriptions/{id}/unsubscription:
    get:
      description: 'Unsubscribes the subscription from the topic.


        The topic API endpoint is required for this operation.

        To get the topic API endpoint, use GetTopic

        and review the `apiEndpoint` value in the response (NotificationTopic).


        Transactions Per Minute (TPM) per-tenancy limit for this operation: 60.


        For instructions, see

        Unsubscribing a Subscription from a Topic.'
      operationId: GetUnsubscription
      parameters:
      - description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subscription to unsubscribe from.

