  /subscriptionsPriorConfirmation:
    post:
      description: 'Creates a subscription where prior confirmation has already been given.

        Creates a subscription for the specified topic in "Active" status, without sending a subscription confirmation URL to the endpoint.

        This is an internal feature only only for whitelisted internal teams. It requires prior approval from Security & Legal.

        The subscriptions recipients must all have already provided consent to receive notifications from Oracle.


        For instructions, see

        Creating a Subscription.


        The subscription is created in "Active" status.


        The topic API endpoint is required for this operation.

        To get the topic API endpoint, use GetTopic

        and review the `apiEndpoint` value in the response (NotificationTopic).


        Transactions Per Minute (TPM) per-tenancy limit for this operation: 60.'
      operationId: CreateSubscriptionPriorConfirmation
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: Created
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
