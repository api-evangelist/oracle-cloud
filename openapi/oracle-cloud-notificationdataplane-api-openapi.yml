          content:
            application/json:
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
      - notificationDataPlane
      x-example: 'GET /20181201/subscriptions/<var>&lt;subscription_OCID&gt;</var>/unsubscription?token=<var>&lt;subscription_confirmation_token&gt;</var>&protocol=EMAIL

        Host: <var>&lt;topic API endpoint&gt;</var>

        '
      x-related-resource: '#/definitions/Subscription'
      summary: Get unsubscription
      x-summary-source: derived
  /subscriptions/{subscriptionId}:
    delete:
      description: 'Deletes the specified subscription.


