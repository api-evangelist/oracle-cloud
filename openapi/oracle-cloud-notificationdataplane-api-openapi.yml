      x-example: "POST /20181201/subscriptionsPriorConfirmation\nHost: <var>&lt;topic API endpoint&gt;</var>\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"topicId\": \"<var>&lt;topic_OCID&gt;</var>\",\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"protocol\": \"EMAIL\",\n  \"endpoint\": \"john.smith@example.com\"\n}\n"
      x-related-resource: '#/definitions/Subscription'
      requestBody:
        content:
