        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
      - notificationDataPlane
      x-example: 'GET /20181201/subscriptions/<var>&lt;subscription_OCID&gt;</var>/confirmation?token=<var>&lt;subscription_confirmation_token&gt;</var>&protocol=EMAIL

        Host: <var>&lt;topic API endpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/Subscription'
      summary: Get confirm subscription
      x-summary-source: derived
  /subscriptions/{id}/resendConfirmation:
    post:
      description: 'Resends the confirmation details for the specified subscription.


        The topic API endpoint is required for this operation.

        To get the topic API endpoint, use GetTopic

        and review the `apiEndpoint` value in the response (NotificationTopic).


        Transactions Per Minute (TPM) per-tenancy limit for this operation: 60.


