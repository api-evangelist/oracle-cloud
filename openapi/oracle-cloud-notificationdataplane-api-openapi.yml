openapi: 3.2.0
info:
  description: 'Use the Notifications API to broadcast messages to distributed components by topic, using a publish-subscribe pattern.

    For information about managing topics, subscriptions, and messages, see the Notifications documentation.'
  title: Notifications Notification Data Plane API
  version: '20181201'
servers:
- url: https://notification.{region}.oraclecloud.com/20181201
tags:
- name: notificationDataPlane
paths:
  /smsNumbers:
    get:
      description: List the SMS numbers.
      operationId: ListSmsNumbers
      parameters:
      - $ref: '#/components/parameters/FilterByStateQueryParam'
      - $ref: '#/components/parameters/FilterBySmsProviderIdQueryParam'
      - $ref: '#/components/parameters/FilterByUpdatedStartTimeQueryParam'
      - $ref: '#/components/parameters/FilterByUpdatedEndTimeQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: Success
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain.

                For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SmsNumberSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
      - notificationDataPlane
      summary: List sms numbers
      x-summary-source: derived
  /subscriptions:
    get:
      description: 'Lists the subscriptions in the specified compartment or topic.


        The topic API endpoint is required for this operation.

        To get the topic API endpoint, use GetTopic

        and review the `apiEndpoint` value in the response (NotificationTopic).


        Transactions Per Minute (TPM) per-tenancy limit for this operation: 60.


        For instructions, see

        Listing Subscriptions.'
      operationId: ListSubscriptions
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/FilterByTopicIdQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/OciNapCorpNetworkHeaderParam'
      responses:
        200:
          description: The list of subscriptions.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain.

                For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-previous-page:
              description: 'For list pagination. When this header appears in the response, previous pages of results remain.

                For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
      - notificationDataPlane
      x-example: 'Sample 1: List all subscriptions in a compartment


        GET /20181201/subscriptions?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: <var>&lt;topic API endpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>


        Sample 2: List all subscriptions for a topic


        GET /20181201/subscriptions?topicId=<var>&lt;topic_OCID&gt;</var>

        Host: <var>&lt;topic API endpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/Subscription'
      summary: List subscriptions
      x-summary-source: derived
    post:
      description: 'Creates a subscription for the specified topic and sends a subscription confirmation URL to the endpoint.


        For instructions, see

        Creating a Subscription.


        The subscription remains in "Pending" status until it has been confirmed.

        For information about confirming subscriptions, see

        Confirming a Subscription.


        The topic API endpoint is required for this operation.

        To get the topic API endpoint, use GetTopic

        and review the `apiEndpoint` value in the response (NotificationTopic).


        Transactions Per Minute (TPM) per-tenancy limit for this operation: 60.'
      operationId: CreateSubscription
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/OciNapCorpNetworkHeaderParam'
      responses:
        200:
          description: Created
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      tags:
      - notificationDataPlane
      x-example: "POST /20181201/subscriptions\nHost: <var>&lt;topic API endpoint&gt;</var>\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"topicId\": \"<var>&lt;topic_OCID&gt;</var>\",\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"protocol\": \"EMAIL\",\n  \"endpoint\": \"john.smith@example.com\"\n}\n"
      x-related-resource: '#/definitions/Subscription'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionDetails'
        description: The subscription to create.
        required: true
      summary: Create subscription
      x-summary-source: derived
  /subscriptions/{id}/confirmation:
    get:
      description: 'Gets the confirmation details for the specified subscription.


        The topic API endpoint is required for this operation.

        To get the topic API endpoint, use GetTopic

        and review the `apiEndpoint` value in the response (NotificationTopic).


        Transactions Per Minute (TPM) per-tenancy limit for this operation: 60.


        For instructions, see

        Getting Confirmation Results for a Subscription.'
      operationId: GetConfirmSubscription
      parameters:
      - description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subscription to get the confirmation details for.

          '
        in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/TokenQueryParam'
      - $ref: '#/components/parameters/ProtocolQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: Success
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
