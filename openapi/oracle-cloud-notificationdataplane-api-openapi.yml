        description: The subscription to create.
        required: true
      summary: Create subscription prior confirmation
      x-summary-source: derived
  /topics/{topicId}/messages:
    post:
      description: 'Publishes a message to the specified topic.


        The topic API endpoint is required for this operation.

        To get the topic API endpoint, use GetTopic

        and review the `apiEndpoint` value in the response (NotificationTopic).


        All limits are per tenancy.


        Message size limit per request: 64KB.


        Transactions Per Minute (TPM) per-tenancy limit for this operation: 60 per topic. (This TPM limit represents messages per minute.)


        For other limits information, including message delivery limits by subscription, see

        Limits for Publishing Messages.

        For more information about publishing messages, see

        Publishing a Message to a Topic.

        For steps to request a limit increase, see

        Requesting a Service Limit Increase.'
      operationId: PublishMessage
      parameters:
      - description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the topic.

          '
        in: path
        name: topicId
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/MessageTypeHeaderParam'
      - $ref: '#/components/parameters/OciNapCorpNetworkHeaderParam'
      responses:
        200:
          description: Published
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
