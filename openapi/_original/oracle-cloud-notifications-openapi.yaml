          [Creating a Subscription](/iaas/Content/Notification/Tasks/create-subscription.htm).

          '
        example: abc@oracle.com
        maxLength: 512
        type: string
      freeformTags: *id002
      metadata:
        description: Metadata for the subscription.
        maxLength: 1024
        type: string
      protocol:
        description: "The protocol used for the subscription.\n\nAllowed values:\n\
