          \ endpoints, use `PAGERDUTY`)\n  * `ORACLE_FUNCTIONS`\n  * `PAGERDUTY`\n\
          \  * `SLACK`\n  * `SMS`\n\nFor information about subscription protocols,\
          \ see\n[Supported subscription protocols (on the overview page)](/iaas/Content/Notification/Concepts/notificationoverview.htm#concepts__subscriptionprotocols).\n"
        example: EMAIL
        maxLength: 15
        type: string
      topicId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the topic for the subscription.

