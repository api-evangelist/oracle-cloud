    description: Create an action that delivers to an Oracle Functions Service endpoint.
    required:
    - functionId
    x-example: "{\n  \"actionType\": \"FAAS\",\n  \"description\": \"Function action\"\
      ,\n  \"functionId\": \"ocid1.fnfunc.oc1.phx.<var>&lt;unique_ID&gt;</var>\",\n\
      \  \"isEnabled\": true\n}\n"
  CreateManagedRuleDetails:
    description: Object used to create an events2.0 managed rule.
    properties:
      actions:
        $ref: '#/definitions/ActionDetailsList'
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the compartment to which this rule belongs.

          '
        maxLength: 1024
        minLength: 1
        type: string
      condition:
        description: "A filter that specifies the event that will trigger actions\
          \ associated with this rule. A few\nimportant things to remember about filters:\n\
          \n* Fields not mentioned in the condition are ignored. You can create a\
          \ valid filter that matches\nall events with two curly brackets: `{}`\n\n\
          \  For more examples, see\n[Matching Events with Filters](/iaas/Content/Events/Concepts/filterevents.htm).\n\
          * For a condition with fields to match an event, the event must contain\
          \ all the field names\nlisted in the condition. Field names must appear\
          \ in the condition with the same nesting\nstructure used in the event.\n\
          \n  For a list of reference events, see\n[Services that Produce Events](/iaas/Content/Events/Reference/eventsproducers.htm).\n\
          * Rules apply to events in the compartment in which you create them and\
          \ any child compartments.\nThis means that a condition specified by a rule\
          \ only matches events emitted from resources in\nthe compartment or any\
          \ of its child compartments.\n* Wildcard matching is supported with the\
          \ asterisk (*) character.\n\n  For examples of wildcard matching, see\n\
          [Matching Events with Filters](/iaas/Content/Events/Concepts/filterevents.htm)\n\
          \nExample: `\\\"eventType\\\": \\\"com.oraclecloud.databaseservice.autonomous.database.backup.end\\\
          \"`\n"
        type: string
      definedTags:
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped
            to a namespace.


            Example: `{"CostCenter": "42"}''

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped
          to a namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      description:
        description: 'A string that describes the details of the rule. It does not
          have to be unique, and you can change it. Avoid entering

          confidential information.

          '
        maxLength: 1024
        minLength: 0
        type: string
      displayName:
        description: 'A string that describes the rule. It does not have to be unique,
          and you can change it. Avoid entering

          confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags:
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value
          pair with no predefined name, type, or namespace. Exists for cross-compatibility
          only.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      isEnabled:
        default: true
        description: 'Whether or not this rule is currently enabled.


          Example: `true`

          '
        type: boolean
    required:
    - displayName
    - isEnabled
    - condition
    - actions
    - compartmentId
    type: object
    x-example: "{\n  \"displayName\": \"This rule sends a notification upon completion\
      \ of DbaaS backup\",\n  \"condition\": \"{\n    \\\"eventType\\\": \\\"com.oraclecloud.databaseservice.autonomous.database.backup.end\\\
      \"\n    }\",\n  \"compartmentId\": \"ocid.compartment.oc1..<var>&lt;unique_ID&gt;</var>\"\
      ,\n  \"isEnabled\": true,\n  \"freeformTags\": {\n    \"Department\": \"Finance\"\
