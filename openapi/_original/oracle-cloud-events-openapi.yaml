host: events.$region.oraclecloud.com
info:
  description: "API for the Events Service. Use this API to manage rules and actions\
    \ that create automation \nin your tenancy. For more information, see [Overview\
    \ of Events](/iaas/Content/Events/Concepts/eventsoverview.htm).\n"
  title: Events API
  version: '20181201'
parameters:
  CompartmentIdQueryParam:
    description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the
      compartment to which this rule belongs.

      '
    in: query
    maxLength: 1024
    minLength: 1
    name: compartmentId
    required: true
    type: string
  IfMatchHeader:
    description: 'For optimistic concurrency control. In the PUT or DELETE call for
      a resource, set the if-match

      parameter to the value of the etag from a previous GET or POST response for
      that resource.  The resource

      will be updated or deleted only if the etag you provide matches the resource''s
      current etag value.

      '
    in: header
    name: if-match
    type: string
  ListRulesFilterByLifecycleStateQueryParam:
    description: 'A filter to return only rules that match the lifecycle state in
      this parameter.


      Example: `Creating`

      '
    in: query
    name: lifecycleState
    required: false
    type: string
    x-obmcs-enumref: '#/definitions/Rule/lifecycleState'
  OpcRequestIdHeaderParam:
    description: 'The unique Oracle-assigned identifier for the request. If you need
      to contact Oracle about a

      particular request, please provide the request ID.

      '
    in: header
    name: opc-request-id
    required: false
    type: string
  PaginationLimitQueryParam:
    default: 5
    description: 'The maximum number of items to return. 1 is the minimum, 50 is the
      maximum.

      Default: 10

      '
    in: query
    maximum: 50
    minimum: 1
    name: limit
    required: false
    type: integer
  PaginationTokenQueryParam:
    description: 'For list pagination. The value of the opc-next-page response header
      from the previous

      "List" call. For important details about how pagination works, see

      [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

      '
    in: query
    maxLength: 1024
    minLength: 1
    name: page
    required: false
    type: string
  RetryTokenHeader:
    description: 'A token that uniquely identifies a request so it can be retried
      in case of a timeout or

      server error without risk of executing that same action again. Retry tokens
      expire after 24

      hours, but can be invalidated before then due to conflicting operations (for
      example, if a resource

      has been deleted and purged from the system, then a retry of the original creation
      request

      may be rejected).

      '
    in: header
    maxLength: 64
    minLength: 1
    name: opc-retry-token
    type: string
  RuleIdPathParam:
    description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of this
      rule.

      '
    in: path
    name: ruleId
    required: true
    type: string
  ServiceIdPathParam:
    description: 'The manager/owner service ID - the tenancy OCID.

      '
    in: path
    name: serviceId
    required: true
    type: string
  SortOrderQueryParam:
    description: 'Specifies sort order.


      * **ASC:** Ascending sort order.

      * **DESC:** Descending sort order.

      '
    enum:
    - ASC
    - DESC
    in: query
    name: sortOrder
    required: false
    type: string
paths:
  /rules:
    get:
      description: 'Lists rules for this compartment.

        '
      operationId: ListRules
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/ListRulesFilterByLifecycleStateQueryParam'
      - description: 'A filter to return only rules with descriptions that match the
          displayName string

          in this parameter.


          Example: `"This rule sends a notification upon completion of DbaaS backup."`

          '
        in: query
        maxLength: 1024
        minLength: 1
        name: displayName
        required: false
        type: string
      - description: 'Specifies the attribute with which to sort the rules.


          Default: `timeCreated`


          * **TIME_CREATED:** Sorts by timeCreated.

          * **DISPLAY_NAME:** Sorts by displayName.

          * **ID:** Sorts by id.

          '
        enum:
        - TIME_CREATED
        - ID
        - DISPLAY_NAME
        in: query
        name: sortBy
        required: false
        type: string
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: Succesfully retrieved summary of rules.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response,
                additional pages of

                results remain. For important details about how pagination works,
                see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If
                you need to contact Oracle about

                a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/RuleSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists rules for this compartment.
      tags:
      - events
      x-example: 'GET /20181201/rules?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: events.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    post:
      description: 'Creates a new rule.

        '
      operationId: CreateRule
      parameters:
      - description: Specification of the rule to create
        in: body
        name: CreateRuleDetails
        required: true
        schema:
          $ref: '#/definitions/CreateRuleDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: Succesfully created rule.
          headers:
            etag:
              description: 'For optimistic concurrency control. Add this value to
                the `if-match` parameter

                in a PUT or DELETE operation. The resource will be updated only if
                the value you

                provide matches the `etag` on the resource.

                '
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If
                you need to contact Oracle about

                a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/Rule'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Creates a new rule
      tags:
      - events
      x-example: "POST /20181201/rules\nHost: events.us-phoenix-1.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n\n{\n  \"displayName\"\
        : \"This rule sends a notification upon completion of DbaaS backup\",\n  \"\
        condition\": \"{\n    \\\"eventType\\\": \\\"com.oraclecloud.databaseservice.autonomous.database.backup.end\\\
        \"\n    }\",\n  \"compartmentId\": \"ocid.compartment.oc1..<var>&lt;unique_ID&gt;</var>\"\
        ,\n  \"isEnabled\": true,\n  \"freeformTags\": {\n    \"Department\": \"Finance\"\
        \n    },\n  \"definedTags\": {\n    Operations\": {\n      \"CostCenter\"\
        : \"42\"\n    },\n  \"actions\": {\n    \"actions\": [\n      {\n        \"\
        actionType\": \"ONS\",\n        \"id\": \"ocid.action.oc1..<var>&lt;unique_ID&gt;</var>\"\
        ,\n        \"lifecycleMessage\":null,\n        \"lifecycleState\": \"CREATING\"\
        \n      }\n    ]\n  }\n}\n"
  /rules/{ruleId}:
    delete:
      description: Deletes a rule.
      operationId: DeleteRule
      parameters:
      - $ref: '#/parameters/RuleIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        204:
          description: Rule deleted successfully.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If
                you need to contact Oracle

                about a particular request, please provide the request ID.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
