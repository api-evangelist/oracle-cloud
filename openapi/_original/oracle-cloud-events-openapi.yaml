basePath: /20181201
definitions:
  Action:
    description: 'An object that represents an action to trigger for events that match
      a rule.

      '
    discriminator: actionType
    properties:
      actionType:
        description: 'The action to perform if the condition in the rule matches an
          event.


          * **ONS:** Send to an Oracle Notification Service topic.

          * **OSS:** Send to a stream from Oracle Streaming Service.

          * **FAAS:** Send to an Oracle Functions Service endpoint.

          '
        enum:
        - ONS
        - OSS
        - FAAS
        type: string
      description:
        description: 'A string that describes the details of the action. It does not
          have to be unique, and you can change it. Avoid entering

          confidential information.

          '
        maxLength: 1024
        minLength: 0
        type: string
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the action.

          '
        maxLength: 1024
        minLength: 1
        type: string
      isEnabled:
        default: true
        description: 'Whether or not this action is currently enabled.


          Example: `true`

          '
        type: boolean
      lifecycleMessage:
        description: 'A message generated by the Events service about the current
          state of this action.

          '
        type: string
      lifecycleState:
        description: 'The current state of the rule.

          '
        enum:
        - CREATING
        - ACTIVE
        - INACTIVE
        - UPDATING
        - DELETING
        - DELETED
        - FAILED
        type: string
    required:
    - actionType
    - id
    - lifecycleState
    - lifecycleMessage
    type: object
    x-example: "{\n  \"actions\": [\n    {\n      \"actionType\": \"ONS\",\n     \
      \ \"id\": \"ocid.action.oc1..<var>&lt;unique_ID&gt;</var>\",\n      \"lifecycleMessage\"\
      :null,\n      \"lifecycleState\": \"CREATING\"\n    }\n  ]\n}    \n"
  ActionDetails:
    description: 'Object used to create an action.

      '
    discriminator: actionType
    properties:
      actionType:
        description: 'The action to perform if the condition in the rule matches an
          event.


          * **ONS:** Send to an Oracle Notification Service topic.

          * **OSS:** Send to a stream from Oracle Streaming Service.

          * **FAAS:** Send to an Oracle Functions Service endpoint.

          '
        enum:
        - ONS
        - OSS
        - FAAS
        type: string
      description:
        description: 'A string that describes the details of the action. It does not
          have to be unique, and you can change it. Avoid entering

          confidential information.

          '
        maxLength: 1024
        minLength: 0
        type: string
      isEnabled:
        default: true
        description: 'Whether or not this action is currently enabled.


          Example: `true`

          '
        type: boolean
    required:
    - actionType
    - isEnabled
    type: object
    x-example: "{\n  \"actionType\": \"ONS\",\n  \"isEnabled\": true,\n  \"description\"\
      : \"Notification action\"      \n}\n"
  ActionDetailsList:
    description: A list of ActionDetails objects to create for a rule.
    properties:
      actions:
        description: 'A list of one or more ActionDetails objects.

          '
        items:
          $ref: '#/definitions/ActionDetails'
        maxItems: 10
        minItems: 1
        type: array
    required:
    - actions
    type: object
    x-example: "{\n  \"actions\": [ ]\n}\n"
  ActionList:
    description: 'A list of Action objects associated with a rule.

      '
    properties:
      actions:
        description: 'A list of one or more Action objects.

          '
        items:
          $ref: '#/definitions/Action'
        maxItems: 10
        minItems: 1
        type: array
    required:
    - actions
    type: object
    x-example: "{\n  \"actions\": { }\n}\n"
  ChangeRuleCompartmentDetails:
