    name: lifecycleState
    required: false
    type: array
  ClusterOptionIdPathParam:
    description: The id of the option set to retrieve. Use "all" get all options,
      or use a cluster ID to get options specific to the provided cluster.
    in: path
    name: clusterOptionId
    required: true
    type: string
  CompartmentIdOptionalQueryParam:
    description: The OCID of the compartment.
    in: query
    name: compartmentId
    required: false
    type: string
    x-default-description: 'null'
  CompartmentIdQueryParam:
    description: The OCID of the compartment.
    in: query
    name: compartmentId
    required: true
    type: string
  IdempotencyTokenHeader:
    description: 'A token you supply to uniquely identify the request and provide
      idempotency if

      the request is retried. Idempotency tokens expire after 24 hours.

      '
    in: header
    maxLength: 64
    minLength: 1
    name: opc-retry-token
    type: string
  IfMatchHeader:
    description: 'For optimistic concurrency control. In the PUT or DELETE call for
      a resource, set the `if-match`

      parameter to the value of the etag from a previous GET or POST response for
      that resource.  The resource

      will be updated or deleted only if the etag you provide matches the resource''s
      current etag value.

      '
    in: header
    name: if-match
    type: string
  IsDecrementSizeQueryParam:
    default: true
    description: If the nodepool should be scaled down after the node is deleted.
    in: query
    name: isDecrementSize
    required: false
    type: boolean
  IsForceDeletionAfterOverrideGraceDurationQueryParam:
    description: If the underlying compute instance should be deleted if you cannot
      evict all the pods in grace period
    in: query
    name: isForceDeletionAfterOverrideGraceDuration
    required: false
    type: boolean
    x-default-description: 'null'
  IsForceDeletionAfterOverrideGraceDurationVnpQueryParam:
    description: If the underlying virtual node should be force deleted if all the
      pods are not evicted in the evictionGraceDuration.
    in: query
    name: isForceDeletionAfterOverrideGraceDurationVnp
    required: false
    type: boolean
    x-default-description: 'null'
  IsOpenIdConnectAuthConfigFileIncludedQueryParam:
    description: 'Boolean value to determine if the OpenIdConnectAuth configuration
      file should be displayed for the provided cluster.

      '
    in: query
    name: shouldIncludeOidcConfigFile
    required: false
    type: boolean
    x-default-description: 'null'
  IsRemoveExistingAddOnQueryParam:
    description: Whether existing addon resources should be deleted or not. True would
      remove the underlying resources completely.
    in: query
    name: isRemoveExistingAddOn
    required: true
    type: boolean
  KubernetesVersionQueryParam:
    description: The kubernetes version to fetch the addons.
    in: query
    name: kubernetesVersion
    required: true
    type: string
  NameFilterQueryParam:
    description: The name to filter on.
    in: query
    name: name
    type: string
  NodeIdPathParam:
    description: The OCID of the compute instance.
    in: path
    name: nodeId
    required: true
    type: string
  NodePoolIdPathParam:
    description: The OCID of the node pool.
    in: path
    name: nodePoolId
    required: true
    type: string
  NodePoolK8sVersionQueryParam:
    description: Filter node pool options by Kubernetes version.
    in: query
    name: nodePoolK8sVersion
    required: false
    type: string
    x-default-description: options for all K8s versions
  NodePoolLifecycleStateFilterQueryParam:
    collectionFormat: multi
    description: A list of nodepool lifecycle states on which to filter on, matching
      any of the list items (OR logic). eg. [ACTIVE, DELETING]. For more information,
      see [Monitoring Clusters](/Content/ContEng/Tasks/contengmonitoringclusters.htm)
    in: query
    items:
      enum: *id009
      type: string
      x-obmcs-top-level-enum: '#/definitions/NodePoolLifecycleState'
    name: lifecycleState
    required: false
    type: array
  NodePoolOptionIdPathParam:
    description: The id of the option set to retrieve. Use "all" get all options,
      or use a cluster ID to get options specific to the provided cluster.
    in: path
    name: nodePoolOptionId
    required: true
    type: string
  NodePoolOsArchQueryParam:
    description: Filter node pool options by OS architecture.
