paths:
  /addonOptions:
    get:
      description: Get list of supported addons for a specific kubernetes version.
      operationId: ListAddonOptions
      parameters:
      - $ref: '#/parameters/KubernetesVersionQueryParam'
      - $ref: '#/parameters/AddonNameQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - description: The optional field to sort the results by.
        enum:
        - NAME
        - TIME_CREATED
        in: query
        name: sortBy
        required: false
        type: string
      - default: false
        description: 'Specifies whether all add-on versions should be displayed. The
          default value is false. If set to true, the API will return all available
          add-on versions, including deprecated versions and detailed build numbers.

          Please note that the use of deprecated versions, as well as the specification
          of a particular build of a supported version, is not recommended for standard
