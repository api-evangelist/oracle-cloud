basePath: /20180222
consumes:
- application/json
definitions:
  AddOnOptions:
    description: The properties that define options for supported add-ons.
    properties:
      isKubernetesDashboardEnabled:
        description: Whether or not to enable the Kubernetes Dashboard add-on.
        example: true
        type: boolean
      isTillerEnabled:
        description: Whether or not to enable the Tiller add-on.
        example: true
        type: boolean
    type: object
  Addon:
    description: The properties that define an addon.
    properties:
      addonError:
        $ref: '#/definitions/AddonError'
        description: The error info of the addon.
      configurations:
        description: Addon configuration details.
        items:
          $ref: '#/definitions/AddonConfiguration'
        type: array
      currentInstalledVersion:
        description: current installed version of the addon
        example: x.y.z
        type: string
      lifecycleState:
        description: The state of the addon.
        enum: &id001
        - CREATING
        - ACTIVE
        - DELETING
        - DELETED
        - UPDATING
        - NEEDS_ATTENTION
        - FAILED
        example: UPDATING
        type: string
        x-obmcs-top-level-enum: '#/definitions/AddonLifecycleState'
      name:
        description: The name of the addon.
        example: flannel
        type: string
      timeCreated:
        description: The time the cluster was created.
        example: '2017-07-21T16:11:29Z'
        format: date-time
        type: string
      version:
        description: selected addon version, or null indicates autoUpdate
        example: x.y.z
        type: string
    required:
    - lifecycleState
    - name
    type: object
  AddonConfiguration:
    description: Defines the configuration of available addons for a cluster
    properties:
      key:
        description: configuration key name
        example: foo
        maxLength: 255
        minLength: 1
        type: string
      value:
        description: configuration value name
        example: bar
        maxLength: 8191
        minLength: 1
        type: string
    type: object
  AddonError:
    description: The error info of the addon.
    properties:
      code:
        description: A short error code that defines the upstream error, meant for
          programmatic parsing. See [API Errors](https://docs.us-phoenix-1.oraclecloud.com/Content/API/References/apierrors.htm).
        example: LimitExceeded
        type: string
      message:
        description: A human-readable error string of the upstream error.
        example: error validating payload
        type: string
      status:
        description: The status of the HTTP response encountered in the upstream error.
        example: '429'
        type: string
    type: object
  AddonLifecycleState:
    description: The lifecycle state of an addon.
    enum: *id001
    type: string
  AddonOptionSummary:
    description: The properties that define addon summary.
    properties:
      addonGroup:
        description: Addon group info, a namespace concept that groups addons with
          similar functionalities.
        example: oke/cluster-network
        type: string
      addonSchemaVersion:
        description: Addon definition schema version to validate addon.
        example: '0.1'
        type: string
      definedTags: &id002
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped
            to a namespace.

            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped
          to a namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        example:
          Operations:
            CostCenter: 42
        type: object
      description:
        description: Description on the addon.
        example: BlaBla
        type: string
      freeformTags: &id003
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value
          pair with no predefined name, type, or namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

          Example: `{"Department": "Finance"}`

          '
        example:
          Department: Finance
        type: object
      isEssential:
        description: Is it an essential addon for cluster operation or not.
        example: true
        type: boolean
      lifecycleState:
        description: The life cycle state of the addon.
        enum:
        - ACTIVE
        - INACTIVE
        example: ACTIVE
        type: string
      name:
        description: Name of the addon and it would be unique.
        example: flannel
        type: string
      systemTags: &id004
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types
              are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values
            scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to
          namespaces.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated:
        description: The time the work request was created.
        example: '2017-07-21T16:11:29Z'
        format: date-time
        type: string
      versions:
        description: The resources this work request affects.
        items:
          $ref: '#/definitions/AddonVersions'
        type: array
    required:
    - versions
    - name
    - isEssential
    - lifecycleState
    type: object
  AddonSummary:
    description: The properties that define an addon summary.
    properties:
      addonError:
        $ref: '#/definitions/AddonError'
        description: The error info of the addon.
      currentInstalledVersion:
        description: current installed version of the addon
        example: x.y.z
        type: string
      lifecycleState:
        description: The state of the addon.
        enum: *id001
        example: UPDATING
        type: string
        x-obmcs-top-level-enum: '#/definitions/AddonLifecycleState'
      name:
        description: The name of the addon.
        example: Flannel
        type: string
      timeCreated:
        description: The time the cluster was created.
        example: '2017-07-21T16:11:29Z'
        format: date-time
        type: string
      version:
        description: selected addon version, or null indicates autoUpdate
        example: x.y.z
        type: string
    required:
    - name
    - lifecycleState
    type: object
  AddonVersionConfiguration:
    description: Addon version configuration details.
    properties:
      description:
        description: Information about the addon version configuration.
        example: Addon version configuration information
        type: string
      displayName:
        description: Display name of addon version.
        example: LabelName
        type: string
      isRequired:
        description: If the the configuration is required or not.
        example: true
        type: boolean
      key:
        description: Addon configuration key
        example: labels
        type: string
      value:
        description: Addon configuration value
        example: value
        type: string
    type: object
  AddonVersions:
    description: The properties that define a work request resource.
    properties:
      configurations:
        description: Addon version configuration details.
        items:
          $ref: '#/definitions/AddonVersionConfiguration'
        type: array
      description:
        description: Information about the addon version.
        example: Information about addon version and if any recent changes
        type: string
      kubernetesVersionFilters:
        $ref: '#/definitions/KubernetesVersionsFilters'
        description: The range of kubernetes versions an addon can be configured.
      status:
        description: Current state of the addon, only active will be visible to customer,
          visibility of versions in other status will be filtered  based on limits
          property.
        enum:
        - ACTIVE
        - DEPRECATED
        - PREVIEW
        - RECALLED
        example: ACTIVE
        type: string
      versionNumber:
        description: Version number, need be comparable within an addon.
        example: x.y.z
        type: string
    type: object
  AdmissionControllerOptions:
    description: The properties that define supported admission controllers.
    properties:
      isPodSecurityPolicyEnabled:
        default: false
        description: Whether or not to enable the Pod Security Policy admission controller.
        example: false
        type: boolean
    type: object
  Cluster:
    description: A Kubernetes cluster. Avoid entering confidential information.
    properties:
      availableKubernetesUpgrades:
        description: Available Kubernetes versions to which the clusters masters may
          be upgraded.
        items:
          example: v1.9.4
          type: string
        type: array
      clusterPodNetworkOptions:
        description: Available CNIs and network options for existing and new node
          pools of the cluster
        items:
          $ref: '#/definitions/ClusterPodNetworkOptionDetails'
        maxItems: 255
        type: array
        uniqueItems: true
        x-default-description: 'null'
      compartmentId:
        description: The OCID of the compartment in which the cluster exists.
        example: ocid1.compartment.oc1..aaaaaaaafqm2df7ckwmmbtdsl2bgxsw4fcpvkoojytxrqst24yww2tdmtqcq
        type: string
      definedTags: *id002
      endpointConfig:
        $ref: '#/definitions/ClusterEndpointConfig'
        description: 'The network configuration for access to the Cluster control
          plane.

          '
      endpoints:
        $ref: '#/definitions/ClusterEndpoints'
        description: Endpoints served up by the cluster masters.
      freeformTags: *id003
      id:
        description: The OCID of the cluster.
        example: ocid1.cluster.oc1.iad.aaaaaaaaga3tombrmq3wgyrvmi3gcn3bmfsdizjwgy4wgyldmy3dcmtcmmyw
        type: string
      imagePolicyConfig:
        $ref: '#/definitions/ImagePolicyConfig'
        description: 'The image verification policy for signature validation.

          '
      kmsKeyId:
        description: The OCID of the KMS key to be used as the master encryption key
          for Kubernetes secret encryption.
        type: string
      kubernetesVersion:
        description: The version of Kubernetes running on the cluster masters.
        example: v1.9.4
        type: string
      lifecycleDetails:
        description: Details about the state of the cluster masters.
        example: waiting for node pools
        type: string
      lifecycleState:
        description: The state of the cluster masters. For more information, see [Monitoring
          Clusters](/Content/ContEng/Tasks/contengmonitoringclusters.htm)
        enum: &id005
        - CREATING
        - ACTIVE
        - FAILED
        - DELETING
        - DELETED
        - UPDATING
        example: UPDATING
        type: string
        x-obmcs-top-level-enum: '#/definitions/ClusterLifecycleState'
      metadata:
        $ref: '#/definitions/ClusterMetadata'
        description: Metadata about the cluster.
      name:
        description: The name of the cluster.
        example: My Cluster
        type: string
      openIdConnectDiscoveryEndpoint:
        description: 'The cluster-specific OpenID Connect Discovery endpoint

          '
        example: https://objectstorage.us-ashburn-1.oci.customer-oci.com/n/id9y6mi8tcky/b/oidc/o/a1936058-8b1c-4527-b21c-6766527236f6/.well-known/openid-configuration
        type: string
      openIdConnectDiscoveryKey:
        description: 'The cluster-specific OpenID Connect Discovery Key to derive
          the DiscoveryEndpoint

          '
        example: a1936058-8b1c-4527-b21c-6766527236f6
        type: string
      options:
        $ref: '#/definitions/ClusterCreateOptions'
        description: Optional attributes for the cluster.
      systemTags: *id004
      type:
        description: Type of cluster
        enum: &id006
        - BASIC_CLUSTER
        - ENHANCED_CLUSTER
        example: ENHANCED_CLUSTER
        type: string
        x-obmcs-top-level-enum: '#/definitions/ClusterType'
      vcnId:
        description: The OCID of the virtual cloud network (VCN) in which the cluster
          exists.
        example: ocid1.vcn.oc1.iad.aaaaaaaa5e3hn7hk6y63awlhbvlhsumkn5p3ficbjcevbnoylvptcpkxtsaa
        type: string
    type: object
  ClusterCreateOptions:
    description: The properties that define extra options for a cluster.
    properties:
      addOns:
        $ref: '#/definitions/AddOnOptions'
        description: Configurable cluster add-ons
      admissionControllerOptions:
        $ref: '#/definitions/AdmissionControllerOptions'
        description: Configurable cluster admission controllers
      ipFamilies:
        description: IP family to use for single stack or define the order of IP families
          for dual-stack
        items:
          enum:
          - IPv4
          - IPv6
          type: string
        type: array
        x-default-description: Default legacy behavior will be just IPv4 when property
          not provided
      kubernetesNetworkConfig:
        $ref: '#/definitions/KubernetesNetworkConfig'
        description: Network configuration for Kubernetes.
      openIdConnectDiscovery:
        $ref: '#/definitions/OpenIdConnectDiscovery'
      openIdConnectTokenAuthenticationConfig:
        $ref: '#/definitions/OpenIdConnectTokenAuthenticationConfig'
      persistentVolumeConfig:
        $ref: '#/definitions/PersistentVolumeConfigDetails'
      serviceLbConfig:
        $ref: '#/definitions/ServiceLbConfigDetails'
      serviceLbSubnetIds:
        description: The OCIDs of the subnets used for Kubernetes services load balancers.
        items:
          example: ocid1.subnet.oc1.iad.aaaaaaaanifpelnyzmkvnepohbz4ntswkpl35syzzsugdxceth3ofzxtlyit
          type: string
        type: array
    type: object
  ClusterEndpointConfig:
    description: The properties that define the network configuration for the Cluster
      endpoint.
    properties:
      isPublicIpEnabled:
        default: false
        description: Whether the cluster should be assigned a public IP address. Defaults
          to false. If set to true on a private subnet, the cluster provisioning will
          fail.
        type: boolean
      nsgIds:
        description: 'A list of the OCIDs of the network security groups (NSGs) to
          apply to the cluster endpoint. For more information about NSGs, see [NetworkSecurityGroup](#/en/iaas/20160918/NetworkSecurityGroup/).

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 5
        type: array
        uniqueItems: true
      securityAttributes: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped
            to a [ZPR namespace](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attribute-namespaces).

            '
          type: object
        description: "[Security attributes](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attributes)\
          \ are labels\n        for a resource that can be referenced in a [Zero Trust\
          \ Packet Routing](/iaas/Content/zero-trust-packet-routing/overview.htm)\n\
          \        (ZPR) policy to control access to ZPR-supported resources.\n"
        type: object
      subnetId:
        description: The OCID of the regional subnet in which to place the Cluster
          endpoint.
        type: string
    type: object
  ClusterEndpoints:
    description: The properties that define endpoints for a cluster.
    properties:
      ipv6Endpoint:
        description: The IPv6 networking Kubernetes API server endpoint.
        example: https://yourIPv6Endpoint
        type: string
      kubernetes:
        description: The non-native networking Kubernetes API server endpoint.
        example: https://yourkubernetes
        type: string
      privateEndpoint:
        description: The private native networking Kubernetes API server endpoint.
        example: https://yourPrivateEndpoint
        type: string
      publicEndpoint:
        description: The public native networking Kubernetes API server endpoint,
          if one was requested.
        example: https://yourPublicEndpoint
        type: string
      vcnHostnameEndpoint:
        description: 'The FQDN assigned to the Kubernetes API private endpoint.

          Example: ''https://yourVcnHostnameEndpoint''

          '
        example: https://clusterinfo.subnetLabel.vcnLabel.oraclevcn.com:6443
        type: string
    type: object
  ClusterLifecycleState:
    description: The lifecycle state of a cluster. For more information, see [Monitoring
      Clusters](/Content/ContEng/Tasks/contengmonitoringclusters.htm)
    enum: *id005
    type: string
  ClusterMetadata:
    description: The properties that define meta data for a cluster.
    properties:
      createdByUserId:
        description: The user who created the cluster.
        example: ocid1.user.oc1..aaaaaaaanifpelnyzmkvnepohbz4ntswkpl35syzzsugdxceth3oihe8hcfq
        type: string
      createdByWorkRequestId:
        description: The OCID of the work request which created the cluster.
        example: ocid1.clustersworkrequest.oc1.iad.aaaaaaaanifpelnyzmkvnepohbz4ntswkpl35syzzsugdxceth3oihe8hcfq
        type: string
      deletedByUserId:
        description: The user who deleted the cluster.
        example: ocid1.user.oc1..aaaaaaaanifpelnyzmkvnepohbz4ntswkpl35syzzsugdxceth3oihe8hcfq
        type: string
      deletedByWorkRequestId:
        description: The OCID of the work request which deleted the cluster.
        example: ocid1.clustersworkrequest.oc1.iad.aaaaaaaanifpelnyzmkvnepohbz4ntswkpl35syzzsugdxceth3oihe8hcfq
        type: string
      timeCreated:
        description: The time the cluster was created.
        example: '2017-07-21T16:11:29Z'
        format: date-time
        type: string
      timeCredentialExpiration:
        description: The time until which the cluster credential is valid.
        example: '2023-07-21T16:11:29Z'
        format: date-time
        type: string
      timeDeleted:
        description: The time the cluster was deleted.
        example: '2017-07-21T16:11:29Z'
        format: date-time
        type: string
      timeUpdated:
        description: The time the cluster was updated.
        example: '2017-07-21T16:11:29Z'
        format: date-time
        type: string
      updatedByUserId:
        description: The user who updated the cluster.
        example: ocid1.user.oc1..aaaaaaaanifpelnyzmkvnepohbz4ntswkpl35syzzsugdxceth3oihe8hcfq
        type: string
      updatedByWorkRequestId:
        description: The OCID of the work request which updated the cluster.
        example: ocid1.clustersworkrequest.oc1.iad.aaaaaaaanifpelnyzmkvnepohbz4ntswkpl35syzzsugdxceth3oihe8hcfq
        type: string
    type: object
  ClusterMigrateToNativeVcnDetails:
    description: The properties that define a request to migrate a cluster to Native
      VCN.
    properties:
      decommissionDelayDuration:
        description: The optional override of the non-native endpoint decommission
          time after migration is complete. Defaults to 30 days.
        example: P1DT6H
        format: x-obmcs-duration
        type: string
      endpointConfig:
        $ref: '#/definitions/ClusterEndpointConfig'
        description: 'The network configuration for access to the Cluster control
          plane.

          '
    required:
    - endpointConfig
    type: object
  ClusterMigrateToNativeVcnStatus:
    description: Information regarding a cluster's move to Native VCN.
    properties:
      state:
        description: The current migration status of the cluster.
        enum:
        - NOT_STARTED
        - REQUESTED
        - IN_PROGRESS
        - PENDING_DECOMMISSION
        - COMPLETED
        example: IN_PROGRESS
        type: string
      timeDecommissionScheduled:
        description: The date and time the non-native VCN is due to be decommissioned.
        example: '2017-07-21T16:11:29Z'
        format: date-time
        type: string
    required:
    - state
    type: object
  ClusterNode:
    description: The properties that define a cluster node.
    properties:
      clusterId:
        description: The OCID of the cluster to which this node belongs.
        example: ocid1.cluster.oc1.iad.aaaaaaaanifpelnyzmkvnepohbz4ntswkpl35syzzsugdxceth3oihe8hcfq
        type: string
      id:
        description: The OCID of the compute instance backing this node.
        example: ocid1.instance.oc1.iad.aaaaaaaaga3tombrmq3wgyrvmi3gcn3bmfsdizjwgyswgycdoy3tcmtctmyw
        type: string
    type: object
  ClusterOptions:
    description: Options for creating or updating clusters.
    properties:
      clusterPodNetworkOptions:
        description: Available CNIs and network options for existing and new node
          pools of the cluster
        items:
          $ref: '#/definitions/ClusterPodNetworkOptionDetails'
        maxItems: 255
        type: array
        uniqueItems: true
        x-default-description: when unspecified in case of updates, the current value
          of this field will be preserved, else value set to null
      kubernetesVersions:
        description: Available Kubernetes versions.
        items:
          example: v1.9.4
          type: string
        type: array
    type: object
  ClusterPodNetworkOptionDetails:
    description: The CNI type and relevant network details potentially applicable
      to the node pools of the cluster
    discriminator: cniType
    properties:
      cniType:
        description: The CNI used by the node pools of this cluster
        enum:
        - OCI_VCN_IP_NATIVE
        - FLANNEL_OVERLAY
        maxLength: 255
        minLength: 1
        type: string
    required:
    - cniType
  ClusterSummary:
    description: The properties that define a cluster summary.
    properties:
      availableKubernetesUpgrades:
        description: Available Kubernetes versions to which the clusters masters may
          be upgraded.
        items:
          example: v1.9.4
          type: string
        type: array
      clusterPodNetworkOptions:
        description: Available CNIs and network options for existing and new node
          pools of the cluster
        items:
          $ref: '#/definitions/ClusterPodNetworkOptionDetails'
        maxItems: 255
        type: array
        uniqueItems: true
        x-default-description: 'null'
      compartmentId:
        description: The OCID of the compartment in which the cluster exists.
        example: ocid1.compartment.oc1..aaaaaaaafqm2df7ckwmmbtdsl2bgxsw4fcpvkoojytxrqst24yww2tdmtqcq
        type: string
      definedTags: *id002
      endpointConfig:
        $ref: '#/definitions/ClusterEndpointConfig'
        description: 'The network configuration for access to the Cluster control
          plane.

          '
      endpoints:
        $ref: '#/definitions/ClusterEndpoints'
        description: Endpoints served up by the cluster masters.
      freeformTags: *id003
      id:
        description: The OCID of the cluster.
        example: ocid1.cluster.oc1.iad.aaaaaaaaga3tombrmq3wgyrvmi3gcn3bmfsdizjwgy4wgyldmy3dcmtcmmyw
        type: string
      imagePolicyConfig:
        $ref: '#/definitions/ImagePolicyConfig'
        description: 'The image verification policy for signature validation.

          '
      kubernetesVersion:
        description: The version of Kubernetes running on the cluster masters.
        example: v1.9.4
        type: string
      lifecycleDetails:
        description: Details about the state of the cluster masters.
        example: waiting for node pools
        type: string
      lifecycleState:
        description: The state of the cluster masters. For more information, see [Monitoring
          Clusters](/Content/ContEng/Tasks/contengmonitoringclusters.htm)
        enum: *id005
        example: UPDATING
        type: string
        x-obmcs-top-level-enum: '#/definitions/ClusterLifecycleState'
      metadata:
        $ref: '#/definitions/ClusterMetadata'
        description: Metadata about the cluster.
      name:
        description: The name of the cluster.
        example: My Cluster Summary
        type: string
      options:
        $ref: '#/definitions/ClusterCreateOptions'
        description: Optional attributes for the cluster.
      systemTags: *id004
      type:
        description: Type of cluster. Values can be BASIC_CLUSTER or ENHANCED_CLUSTER.
          For more information, see [Cluster Types](/Content/ContEng/Tasks/contengcomparingenhancedwithbasicclusters_topic.htm)
        enum: *id006
        example: ENHANCED_CLUSTER
        type: string
        x-obmcs-top-level-enum: '#/definitions/ClusterType'
      vcnId:
        description: The OCID of the virtual cloud network (VCN) in which the cluster
          exists
        example: ocid1.vcn.oc1.iad.aaaaaaaa5e3hn7hk6y63awlhbvlhsumkn5p3ficbjcevbnoylvptcpkxtsaa
        type: string
    type: object
  ClusterType:
    description: The type of a cluster.
    enum: *id006
    type: string
  CreateClusterDetails:
    description: The properties that define a request to create a cluster.
    properties:
      clusterPodNetworkOptions:
        description: Available CNIs and network options for existing and new node
          pools of the cluster
        items:
          $ref: '#/definitions/ClusterPodNetworkOptionDetails'
        maxItems: 255
        type: array
        uniqueItems: true
        x-default-description: 'null'
      compartmentId:
        description: The OCID of the compartment in which to create the cluster.
        example: ocid1.compartment.oc1..aaaaaaaafqm2df7ckwmmbtdsl2bgxsw4fcpvkoojytxrqst24yww2tdmtqcq
        type: string
      definedTags: *id002
      endpointConfig:
        $ref: '#/definitions/CreateClusterEndpointConfigDetails'
        description: 'The network configuration for access to the Cluster control
          plane.

          '
      freeformTags: *id003
      imagePolicyConfig:
        $ref: '#/definitions/CreateImagePolicyConfigDetails'
        description: 'The image verification policy for signature validation. Once
          a policy is created and enabled with

          one or more kms keys, the policy will ensure all images deployed has been
          signed with the key(s)

          attached to the policy.

          '
      kmsKeyId:
        description: 'The OCID of the KMS key to be used as the master encryption
          key for Kubernetes secret encryption.

          When used, `kubernetesVersion` must be at least `v1.13.0`.

          '
        maxLength: 255
        minLength: 1
        type: string
        x-default-description: 'null'
      kubernetesVersion:
        description: The version of Kubernetes to install into the cluster masters.
        example: v1.9.4
        type: string
      name:
        description: The name of the cluster. Avoid entering confidential information.
