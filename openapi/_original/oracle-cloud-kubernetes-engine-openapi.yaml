    - AARCH64
    in: query
    name: nodePoolOsArch
    required: false
    type: string
    x-default-description: options for all OS architectures
  NodePoolOsTypeQueryParam:
    description: Filter node pool options by OS type.
    enum:
    - OL7
    - OL8
    - UBUNTU
    in: query
    name: nodePoolOsType
    required: false
    type: string
    x-default-description: options for all OS type
  OverrideEvictionGraceDurationQueryParam:
    description: 'Duration after which OKE will give up eviction of the pods on the
      node.

      PT0M will indicate you want to delete the node without cordon and drain. Default
      PT60M, Min PT0M, Max: PT60M. Format ISO 8601 e.g PT30M

      '
    format: x-obmcs-duration
    in: query
    name: overrideEvictionGraceDuration
    required: false
    type: string
    x-default-description: PT60M
  OverrideEvictionGraceDurationVnpQueryParam:
    description: 'Duration after which SKE will give up eviction of the pods on the
      node.

      PT0M will indicate you want to delete the virtual node without cordon and drain.
      Default PT60M, Min PT0M, Max: PT60M. Format ISO 8601 e.g PT30M

      '
    format: x-obmcs-duration
    in: query
    name: overrideEvictionGraceDurationVnp
    required: false
    type: string
    x-default-description: PT60M
