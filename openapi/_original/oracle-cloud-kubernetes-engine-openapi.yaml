    in: path
    name: clusterId
    required: true
    type: string
  ClusterIdQueryParam:
    description: The OCID of the cluster.
    in: query
    name: clusterId
    type: string
  ClusterLifecycleStateFilterQueryParam:
    collectionFormat: multi
    description: A cluster lifecycle state to filter on. Can have multiple parameters
      of this name. For more information, see [Monitoring Clusters](/Content/ContEng/Tasks/contengmonitoringclusters.htm)
    in: query
