info:
  description: 'API for the Kubernetes Engine service (also known as the Container
    Engine for Kubernetes service). Use this API to build, deploy,

    and manage cloud-native applications. For more information, see

    [Overview of Kubernetes Engine](/iaas/Content/ContEng/Concepts/contengoverview.htm).

    '
  title: Kubernetes Engine API
  version: '20180222'
parameters:
  AddonNamePathParam:
    description: The name of the addon.
    in: path
    name: addonName
    required: true
    type: string
  AddonNameQueryParam:
    description: The name of the addon.
    in: query
    name: addonName
    required: false
    type: string
