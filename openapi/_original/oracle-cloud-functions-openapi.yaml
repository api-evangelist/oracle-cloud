          Example: `{"Department": "Finance"}`

          '
        type: object
      image:
        description: 'The qualified name of the Docker image to use in the function,
          including the image tag.

          The image should be in the OCI Registry that is in the same region as the
          function itself.

          Example: `phx.ocir.io/ten/functions/function:0.0.1`

          '
        type: string
      imageDigest:
        description: 'The image digest for the version of the image that will be pulled
          when invoking this function.

          If no value is specified, the digest currently associated with the image
          in the OCI Registry will be used.

          Example: `sha256:ca0eeb6fb05351dfc8759c20733c91def84cb8007aa89a5bf606bc8b315b9fc7`

          '
        type: string
      memoryInMBs:
