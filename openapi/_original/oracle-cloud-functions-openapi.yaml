          Example: `2018-09-12T22:47:12.613Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The time the application was updated, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)

          timestamp format.

          Example: `2018-09-12T22:47:12.613Z`

          '
        format: date-time
        type: string
      traceConfig:
        $ref: '#/definitions/ApplicationTraceConfig'
    required:
    - id
    type: object
  ApplicationTraceConfig:
    description: 'Define the tracing configuration for an application.

      '
    properties:
      domainId:
        description: "The OCID of the collector (e.g. an APM Domain) trace events\
          \ will be sent to. \n"
        maxLength: 255
        minLength: 1
        type: string
      isEnabled:
        description: 'Define if tracing is enabled for the resource.

          '
        type: boolean
    type: object
  ChangeApplicationCompartmentDetails:
    description: 'Properties to change the compartment of an application.

      '
    properties:
      compartmentId:
        description: "The [OCID](/Content/General/Concepts/identifiers.htm) of the\
          \ compartment\ninto which the resource should be moved.  \n"
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  ConfigDetails:
    description: Details about the required and optional Function configurations needed
      for proper performance of the PBF.
    properties:
      description:
        description: Details about why this config is required and what it will be
          used for.
        example: The hostname for the target Splunk Enterprise/Cloud instance.
        maxLength: 1024
        minLength: 1
        type: string
      isOptional:
        default: false
        description: Is this a required config or an optional one. Requests with required
          config params missing will be rejected.
        example: false
        type: boolean
      key:
        description: The key name of the config param.
        example: SPLUNK_HEC_HOST
        type: string
    required:
    - key
    - description
    type: object
  ConstantProvisionedConcurrencyConfig:
    allOf:
    - $ref: '#/definitions/FunctionProvisionedConcurrencyConfig'
    - discriminator: CONSTANT
      properties:
        count:
          description: 'Configuration specifying a constant amount of provisioned
