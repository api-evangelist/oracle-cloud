basePath: /20181201
consumes:
- application/json
definitions:
  Application:
    description: 'An application contains functions and defined attributes shared
      between those functions, such as network configuration and configuration. Avoid
      entering confidential information.

      '
    properties:
      compartmentId:
        description: 'The OCID of the compartment that contains the application.

          '
        maxLength: 255
        minLength: 1
        type: string
      config:
        additionalProperties:
          type: string
        description: 'Application configuration for functions in this application
          (passed as environment variables). Can be overridden by function configuration.

          Keys must be ASCII strings consisting solely of letters, digits, and the
          ''_'' (underscore) character, and must not begin with a digit. Values should
          be limited to printable unicode characters.


          Example: `{"MY_FUNCTION_CONFIG": "ConfVal"}`


          The maximum size for all configuration keys and values is limited to 4KB.
          This is measured as the sum of octets necessary to represent each key and
          value in UTF-8.

          '
        maxProperties: 100
        type: object
      definedTags:
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped
            to a namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped
          to a namespace. For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      displayName:
        description: 'The display name of the application. The display name is unique
          within the compartment containing the application.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags:
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value
          pair with no predefined name, type, or namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the application.

          '
        maxLength: 255
        minLength: 1
        type: string
      imagePolicyConfig:
        $ref: '#/definitions/ImagePolicyConfig'
      lifecycleState:
        description: 'The current state of the application.

          '
        enum:
        - CREATING
        - ACTIVE
        - INACTIVE
        - UPDATING
        - DELETING
        - DELETED
        - FAILED
        type: string
      logging:
        $ref: '#/definitions/ApplicationLoggingConfig'
      networkSecurityGroupIds:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm)s
          of the Network Security Groups to add the application to.

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 5
        type: array
      securityAttributes: &id001
        additionalProperties:
          additionalProperties:
            description: 'Attribute value and mode. Only the String type is supported
              for value. Mode is currently always "enforce".

              '
            type: object
          description: 'Key-value pair representing a security attribute key and value,
            scoped to a namespace.


            Example: `{"MaxEgressCount": {"value": "42", "mode": "enforce"}}`

            '
          type: object
        description: 'Security attributes for this resource. Each key is predefined
          and scoped to a namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Oracle-ZPR": {"MaxEgressCount": {"value": "42", "mode": "enforce"}}}`

          '
        type: object
      shape: &id002
        description: 'Valid values are `GENERIC_X86`, `GENERIC_ARM` and `GENERIC_X86_ARM`.
          Default is `GENERIC_X86`. Setting this to `GENERIC_X86`, will run the functions
          in the application on X86 processor architecture.

          Setting this to `GENERIC_ARM`, will run the functions in the application
          on ARM processor architecture.

          When set to `GENERIC_X86_ARM`, functions in the application are run on either
          X86 or ARM processor architecture.

          Accepted values are:

          `GENERIC_X86`, `GENERIC_ARM`, `GENERIC_X86_ARM`

          '
        enum:
        - GENERIC_X86
        - GENERIC_ARM
        - GENERIC_X86_ARM
        type: string
      subnetIds:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm)s
          of the subnets in which to run functions in the application.

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        type: array
      syslogUrl:
        description: 'A syslog URL to which to send all function logs. Supports tcp,
          udp, and tcp+tls.

          The syslog URL must be reachable from all of the subnets configured for
          the application.

          Note: If you enable the OCI Logging service for this application, the syslogUrl
          value is ignored. Function logs are sent to the OCI Logging service, and
          not to the syslog URL.


          Example: `tcp://logserver.myserver:1234`

          '
        maxLength: 1024
        type: string
      timeCreated:
        description: 'The time the application was created, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)

          timestamp format.


          Example: `2018-09-12T22:47:12.613Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The time the application was updated, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)

          timestamp format.

          Example: `2018-09-12T22:47:12.613Z`

          '
        format: date-time
        type: string
      traceConfig:
        $ref: '#/definitions/ApplicationTraceConfig'
    required:
    - id
    type: object
  ApplicationLoggingConfig:
    description: 'Set logging configuration for an application. This is only used
      if Service Logs for the application are enabled in the OCI Logging service.

      '
    properties:
      lineFormat:
        default: PLAIN_TEXT
        description: 'Specify the format of log lines emitted by functions in this
          application.

          '
        enum:
        - JSON
        - PLAIN_TEXT
        type: string
    type: object
  ApplicationSummary:
    description: 'Summary of an application.

