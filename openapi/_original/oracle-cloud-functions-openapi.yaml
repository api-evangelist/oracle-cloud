      '
    discriminator: sourceType
    properties:
      sourceType:
        description: 'Type of the Function Source. Possible values: PBF.

          '
        enum:
        - PRE_BUILT_FUNCTIONS
        type: string
    required:
    - sourceType
    type: object
  FunctionSummary:
    description: 'Summary of a function.

      '
    properties:
