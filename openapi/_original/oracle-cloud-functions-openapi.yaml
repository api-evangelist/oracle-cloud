    - subnetIds
    - compartmentId
    type: object
  CreateFunctionDetails:
    description: 'Properties to create a new function.

      '
    properties:
      applicationId:
        description: The OCID of the application this function belongs to.
        type: string
      config:
        additionalProperties:
          type: string
        description: 'Function configuration. These values are passed on to the function
