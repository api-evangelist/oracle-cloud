      successDestination:
        $ref: '#/definitions/SuccessDestinationDetails'
      timeCreated:
        description: 'The time the function was created, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)

          timestamp format.


          Example: `2018-09-12T22:47:12.613Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The time the function was updated, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)

