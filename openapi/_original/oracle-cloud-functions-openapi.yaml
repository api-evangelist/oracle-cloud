      function invocation.

      A notification is an example of a failure destination.


      Example: `{"kind": "NOTIFICATION", "topicId": "topic_OCID"}`

      '
    discriminator: kind
    properties:
      kind:
        description: 'The type of destination for the response to a failed detached
          function invocation.

          '
        enum:
        - NOTIFICATION
        - QUEUE
        - STREAM
        - NONE
        type: string
    required:
    - kind
    type: object
  Function:
