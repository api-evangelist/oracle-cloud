        description: Timeout for executions of the function. Value in seconds.
        format: int32
        type: integer
      traceConfig:
        $ref: '#/definitions/FunctionTraceConfig'
    required:
    - id
    type: object
  FunctionProvisionedConcurrencyConfig:
    description: 'Define the strategy for provisioned concurrency for the function.

      '
    discriminator: strategy
    properties:
      strategy:
        description: 'The strategy for provisioned concurrency to be used.

          '
        enum:
        - CONSTANT
        - NONE
        type: string
    required:
    - strategy
    type: object
  FunctionSourceDetails:
    description: 'The source details for the Function. The function can be created
