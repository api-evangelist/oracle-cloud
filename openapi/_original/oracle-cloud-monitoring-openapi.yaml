    x-example: "{\n  \"destinations\":\n  [\n    \"ocid1.onstopic.exampleuniqueID\"\
      \n  ]\n}\n"
info:
  description: 'Use the Monitoring API to manage metric queries and alarms for assessing
    the health, capacity, and performance of your cloud resources.

    Endpoints vary by operation. For PostMetricData, use the `telemetry-ingestion`
    endpoints; for all other operations, use the `telemetry` endpoints.

    For more information, see

    [the Monitoring documentation](/iaas/Content/Monitoring/home.htm).

    '
  license:
    name: Oracle Corporation
  title: Monitoring API
  version: '20180401'
parameters:
  AlarmHistoryTypeParam:
    description: 'The type of history entries to retrieve.

      State history (STATE_HISTORY), state transition history (STATE_TRANSITION_HISTORY),
      rule history (RULE_HISTORY) or rule transition history (RULE_TRANSITION_HISTORY).

      If not specified, entries of all types are retrieved.


      Example: `STATE_HISTORY`

      '
    enum:
    - STATE_HISTORY
    - STATE_TRANSITION_HISTORY
    - RULE_HISTORY
    - RULE_TRANSITION_HISTORY
    in: query
    name: alarmHistorytype
    required: false
    type: string
    x-default-description: 'null'
  AlarmIdPathParam:
    description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of an
      alarm.

      '
    in: path
    maxLength: 255
    minLength: 1
    name: alarmId
    required: true
    type: string
  AlarmIdQueryParam:
    description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the
      alarm that is the target of the alarm suppression.
    in: query
    name: alarmId
    required: false
    type: string
  AlarmSuppressionCompartmentIdQueryParam:
    description: "The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the\
      \ compartment for searching. \nUse the tenancy OCID to search in the root compartment.\n\
      \nIf targetType is not specified, searches all suppressions defined under the\
      \ compartment. \nIf targetType is `COMPARTMENT`, searches suppressions in the\
      \ specified compartment only.\n\nExample: `ocid1.compartment.oc1..exampleuniqueID`\n"
    in: query
    maxLength: 255
    minLength: 1
    name: compartmentId
    required: false
    type: string
  AlarmSuppressionIdPathParam:
    description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the
      alarm suppression.
    in: path
    name: alarmSuppressionId
    required: true
    type: string
  AlarmSuppressionLevelQueryParam:
    description: 'The level of this alarm suppression.

      `ALARM` indicates a suppression of the entire alarm, regardless of dimension.

      `DIMENSION` indicates a suppression configured for specified dimensions.

      '
    in: query
    name: level
    required: false
    type: string
    x-default-description: 'null'
    x-obmcs-enumref: '#/definitions/AlarmSuppression/level'
  AlarmSuppressionSortByQueryParam:
    description: 'The field to use when sorting returned alarm suppressions. Only
      one sorting level is provided.


      Example: `timeCreated`

      '
    enum:
    - displayName
    - timeCreated
    - timeSuppressFrom
    in: query
    name: sortBy
    required: false
    type: string
    x-default-description: 'null'
  AlarmSuppressionSortOrderQueryParam:
    description: 'The sort order to use when sorting returned alarm suppressions.
      Ascending (ASC) or descending (DESC).


      Example: `ASC`

      '
    enum:
    - ASC
    - DESC
    in: query
    name: sortOrder
    required: false
    type: string
    x-default-description: 'null'
  AlarmSuppressionTargetTypeQueryParam:
    description: "The target type to use when listing alarm suppressions.    \n`ALARM`\
      \ lists all suppression records for the specified alarm.\n`COMPARTMENT` lists\
      \ all suppression records for the specified compartment or tenancy.\n"
    enum:
    - ALARM
    - COMPARTMENT
    in: query
    name: targetType
    required: false
    type: string
    x-default-description: 'null'
  CompartmentIdInSubtreeQueryParam:
    description: 'When true, returns resources from all compartments and subcompartments.
      The parameter can

      only be set to true when compartmentId is the tenancy OCID (the tenancy is the
      root compartment).

      A true value requires the user to have tenancy-level permissions. If this requirement
      is not met,

      then the call is rejected. When false, returns resources from only the compartment
      specified in

      compartmentId. Default is false.

      '
    in: query
    name: compartmentIdInSubtree
    required: false
    type: boolean
    x-default-description: 'null'
  CompartmentIdQueryParam:
    description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the
      compartment containing the

      resources monitored by the metric that you are searching for. Use tenancyId
      to search in

      the root compartment.


      Example: `ocid1.compartment.oc1..exampleuniqueID`

      '
    in: query
    maxLength: 255
    minLength: 1
    name: compartmentId
    required: true
    type: string
  EncodingHeader:
    description: 'The optional Content-Encoding header that defines the content encodings
      that were applied to the payload.

      '
    in: header
    name: content-encoding
    type: string
  EntityIdQueryParam:
    description: 'A filter to return only resources that match the given entity [OCID](/iaas/Content/General/Concepts/identifiers.htm)
      exactly.

      The resource (entity) must be monitored by the metric that you are searching
      for.


      Example: `ocid1.instance.oc1.phx.exampleuniqueID`

      '
    in: query
    maxLength: 255
    minLength: 1
    name: entityId
    required: false
    type: string
  FilterByAlarmHistoryTimeStampFromParam:
    description: 'A filter to return only alarm history entries with timestamps occurring
      on or after the specified date and time. Format defined by RFC3339.


      Example: `2023-01-01T01:00:00.789Z`

      '
    format: date-time
    in: query
    name: timestampGreaterThanOrEqualTo
    required: false
    type: string
    x-default-description: 'null'
  FilterByAlarmHistoryTimeStampUntilParam:
    description: 'A filter to return only alarm history entries with timestamps occurring
      before the specified date and time. Format defined by RFC3339.


      Example: `2023-01-02T01:00:00.789Z`

      '
    format: date-time
    in: query
    name: timestampLessThan
    required: false
    type: string
    x-default-description: 'null'
  FilterByAlarmSuppressionDisplayNameQueryParam:
    description: 'A filter to return only resources that match the given display name
      exactly.

      Use this filter to list an alarm suppression by name.

      Alternatively, when you know the alarm suppression OCID, use the GetAlarmSuppression
      operation.

      '
    in: query
    maxLength: 255
    minLength: 1
    name: displayName
    required: false
    type: string
    x-default-description: 'null'
  FilterByAlarmSuppressionLifecycleStateQueryParam:
    description: 'A filter to return only resources that match the given lifecycle
      state exactly. When not specified, only resources in the ACTIVE lifecycle state
      are listed.

      '
    in: query
    name: lifecycleState
    required: false
    type: string
    x-default-description: 'null'
    x-obmcs-enumref: '#/definitions/AlarmSuppression/lifecycleState'
  FilterByDisplayNameQueryParam:
    description: 'A filter to return only resources that match the given display name
      exactly.

      Use this filter to list an alarm by name. Alternatively, when you know the alarm
      OCID, use the GetAlarm operation.

      '
    in: query
    maxLength: 255
    minLength: 1
    name: displayName
    required: false
    type: string
    x-default-description: 'null'
  FilterByLifecycleStateQueryParam:
    description: 'A filter to return only alarms that match the given lifecycle state
      exactly. When not specified, only alarms in the ACTIVE lifecycle state are listed.

      '
    in: query
    name: lifecycleState
    required: false
    type: string
    x-default-description: 'null'
    x-obmcs-enumref: '#/definitions/Alarm/lifecycleState'
  IfMatchHeader:
    description: 'For optimistic concurrency control. In the PUT or DELETE call for
      a resource, set the `if-match`

      parameter to the value of the etag from a previous GET or POST response for
      that resource.  The resource

      will be updated or deleted only if the etag you provide matches the resource''s
      current etag value.

      '
    in: header
    name: if-match
    type: string
  IsAllSuppressionsQueryParam:
    description: 'Setting this parameter to true requires the query to specify the
      alarm (`alarmId`).


      When true, lists all alarm suppressions that affect the specified alarm,

      including suppressions that target the corresponding compartment or tenancy.

      When false, lists only the alarm suppressions that target the specified alarm.


      Default is false.

      '
    in: query
    name: isAllSuppressions
    required: false
    type: boolean
    x-default-description: 'null'
  PaginationLimitQueryParam:
    description: 'For list pagination. The maximum number of results per page, or
      items to return in a paginated "List" call.

      For important details about how pagination works, see

      [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).


      Default: 1000


      Example: 500

      '
    in: query
    maximum: 1000
    minimum: 1
    name: limit
    type: integer
    x-default-description: 'null'
  PaginationTokenQueryParam:
    description: 'For list pagination. The value of the `opc-next-page` response header
      from the previous "List" call.

      For important details about how pagination works, see

      [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

      '
    in: query
    maxLength: 512
    minLength: 1
    name: page
    type: string
    x-default-description: 'null'
  RequestIdHeader:
    description: 'Customer part of the request identifier token. If you need to contact
      Oracle about a particular

      request, please provide the complete request ID.

      '
    in: header
    name: opc-request-id
    type: string
  ResourceIdQueryParam:
    description: 'A filter to return only the resource with the specified [OCID](/iaas/Content/General/Concepts/identifiers.htm).

      The resource must be monitored by the metric that you are searching for.


      Example: `ocid1.instance.oc1.phx.exampleuniqueID`

