        format: date-time
        type: string
      namespace:
        description: 'The source service or application to use when searching for
          metric data points to aggregate.


          Example: `oci_computeagent`

          '
        type: string
      query:
        description: 'The Monitoring Query Language (MQL) expression to use when searching
          for metric data points to

          aggregate. The query must specify a metric, statistic, and interval.

          Supported values for interval depend on the specified time range. More interval
          values are supported for smaller time ranges.

          You can optionally specify dimensions and grouping functions.

          When specifying a dimension value, surround it with double quotes, and escape
          each double quote with a backslash (`\`) character.

          Supported grouping functions: `grouping()`, `groupBy()`.


          Construct your query to avoid exceeding limits on returned data. See [MetricData
          Reference](#/en/monitoring/20180401/MetricData).


          For details about Monitoring Query Language (MQL), see

          [Monitoring Query Language (MQL) Reference](/iaas/Content/Monitoring/Reference/mql.htm).

          For available dimensions, review the metric definition for the supported
          service. See

          [Supported Services](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#SupportedServices).


          Example 1: `CpuUtilization[1m].sum()`


          Example 2 (escaped double quotes for value string): `CpuUtilization[1m]{resourceId
          = \"<var>&lt;instance_OCID&gt;</var>\"}.max()`

          '
        maxLength: 1000
        minLength: 1
        type: string
      resolution:
        description: 'The time between calculated aggregation windows. Use with the
          query interval to vary the

          frequency for returning aggregated data points. For example, use a query
          interval of

          5 minutes with a resolution of 1 minute to retrieve five-minute aggregations
          at a one-minute

          frequency. The resolution must be equal or less than the interval in the
          query. The default

          resolution is 1m (one minute). Supported values: `1m`-`60m`, `1h`-`24h`,
          `1d`.


          Example: `5m`

          '
        type: string
      resourceGroup: *id013
      startTime:
        description: 'The beginning of the time range to use when searching for metric
          data points.

          Format is defined by RFC3339. The response includes metric data points for
          the startTime.

          Default value: the timestamp 3 hours before the call was sent.


          Example: `2023-02-01T01:02:29.600Z`

          '
        format: date-time
        type: string
    required:
    - namespace
    - query
    type: object
    x-example: "{\n  \"namespace\": \"oci_computeagent\",\n  \"query\": \"DiskBytesRead[1m]{resourceId\
      \ = \\\"ocid1.instance.region1.phx.exampleuniqueID\\\"}.max()\",\n  \"startTime\"\
      : \"2023-03-10T22:44:26.789Z\",\n  \"endTime\": \"2023-03-10T22:59:26.789Z\"\
      \n}\n"
  Suppression:
    description: 'The configuration details for an alarm-wide suppression.

      For dimension-specific suppressions, see [AlarmSuppression](#/en/monitoring/latest/AlarmSuppression).


