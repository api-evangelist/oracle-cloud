          '
        format: date-time
        type: string
    required:
    - timeSuppressFrom
    - timeSuppressUntil
    type: object
    x-example: "{\n  \"description\": \"Planned outage due to change IT-1234.\",\n\
      \  \"timeSuppressFrom\": \"2023-02-01T01:02:29.600Z\",\n  \"timeSuppressUntil\"\
      : \"2023-02-01T02:02:29.600Z\"\n}\n"
  SuppressionCondition:
    description: 'Precondition for an alarm suppression within the suppression date
