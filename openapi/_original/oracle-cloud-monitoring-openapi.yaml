  /metrics:
    post:
      description: "Publishes raw metric data points to the Monitoring service.\n\
        For a data point to be posted, its timestamp must be near current time (less\
        \ than two hours in the past and less than 10 minutes in the future).\n\n\
        For more information about publishing metrics, see \n[Publishing Custom Metrics](/iaas/Content/Monitoring/Tasks/publishingcustommetrics.htm)\n\
        and\n[Custom Metrics Walkthrough](/iaas/Content/Monitoring/Tasks/custom-metrics-walkthrough.htm).\n\
        For information about developing a metric-posting client, see\n[Developer\
        \ Guide](/iaas/Content/API/Concepts/devtoolslanding.htm).\nFor an example\
        \ client, see\n[MonitoringMetricPostExample.java](https://github.com/oracle/oci-java-sdk/blob/master/bmc-examples/src/main/java/MonitoringMetricPostExample.java).\n\
        For important limits information, see\n[Limits on Monitoring](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#limits).\n\
        \nPer-call limits information follows.\n\n* Dimensions per metric group*.\
        \ Maximum: 20. Minimum: 1.\n* Unique metric streams*. Maximum: 50.\n* Transactions\
        \ Per Second (TPS) per-tenancy limit for this operation: 50.\n\n*A metric\
        \ group is the combination of a given metric, metric namespace, and tenancy\
        \ for the purpose of determining limits.\nA dimension is a qualifier provided\
        \ in a metric definition.\nA metric stream is an individual set of aggregated\
        \ data for a metric with zero or more dimension values.\nFor more information\
        \ about metric-related concepts, see\n[Monitoring Concepts](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#concepts).\n\
        \n**Note:** The endpoints for this operation differ from other Monitoring\
        \ operations. Replace the string `telemetry` with `telemetry-ingestion` in\
        \ the endpoint, as in the following example:\n\nhttps://telemetry-ingestion.eu-frankfurt-1.oraclecloud.com\n"
      operationId: PostMetricData
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/EncodingHeader'
