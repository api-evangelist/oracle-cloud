          is the root compartment).

          A true value requires the user to have tenancy-level permissions. If this
          requirement is not met,

          then the call is rejected. When false, the alarm evaluates metrics from
          only the compartment specified

          in metricCompartmentId. Default is false.


          Example: `true`

          '
        type: boolean
      namespace:
        description: 'The source service or application emitting the metric that is
          evaluated by the alarm.


          Example: `oci_computeagent`

          '
        maxLength: 255
        minLength: 1
        type: string
      notificationTitle: *id008
      notificationVersion: *id009
      overrides: *id010
      pendingDuration: *id004
      query: *id005
      repeatNotificationDuration:
        description: 'The frequency for re-submitting alarm notifications, if the
          alarm keeps firing without

          interruption. Format defined by ISO 8601. For example, `PT4H` indicates
          four hours.

          As another example, `PT0M` indicates a repeat notification each time the
          alarm trigger condition is met,

          otherwise known as an event-based notification. For more information, see

          [Getting Event-Based Notifications for an Alarm](/iaas/Content/Monitoring/Tasks/update-alarm-event.htm).

          Minimum: PT0M. Maximum: P30D.

          '
        type: string
      resolution:
        description: 'The time between calculated aggregation windows for the alarm.
          Supported value: `1m`

          '
        type: string
      resourceGroup:
        description: 'Resource group that you want to match. A null value returns
          only metric data that has no resource groups. The alarm retrieves metric
          data associated with the specified resource group only. Only one resource
          group can be applied per metric.

          A valid resourceGroup value starts with an alphabetical character and includes
          only alphanumeric characters, periods (.), underscores (_), hyphens (-),
          and dollar signs ($).

          Avoid entering confidential information.


          Example: `frontend-fleet`

