      '
    discriminator: conditionType
    properties:
      conditionType:
        description: Type of suppression condition.
        enum:
        - RECURRENCE
        type: string
    required:
    - conditionType
    x-example: "{\n  \"conditionType\": \"RECURRENCE\",\n  \"suppressionRecurrence\"\
      :\"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH;BYHOUR=10;BYMINUTE=00;BYSECOND=00\",\n  \"\
      suppressionDuration\":\"PT1H\"\n}\n"
  UpdateAlarmDetails:
    description: 'The configuration details for updating an alarm.

      '
    properties:
      alarmSummary: *id001
      body: *id003
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
