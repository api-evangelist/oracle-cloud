            [the iCalendar specification (RFC 5545, section 3.3.10)](https://datatracker.ietf.org/doc/html/rfc5545#section-3.3.10).

            Supported rule parts:

            * `FREQ`: Frequency of the recurring suppression: `WEEKLY` or `DAILY`
            only.

            * `BYDAY`: Comma separated days. Use with weekly suppressions only. Supported
            values: `MO`, `TU`, `WE`, `TH`, `FR`, `SA` ,`SU`.

            * `BYHOUR`, `BYMINUTE`, `BYSECOND`: Start time in UTC, after `timeSuppressFrom`
            value. Default is 00:00:00 UTC after `timeSuppressFrom`.

            '
          format: x-obmcs-recurring-time
          type: string
      required:
      - suppressionRecurrence
      - suppressionDuration
    description: 'Alarm suppression recurring schedule. Only one recurrence condition
      is supported within the list of preconditions for a suppression (`suppressionConditions`).

      '
    x-example: "Example 1: Every Monday and Tuesday at 10:00:00 UTC, with one-hour\
      \ duration\n\n{\n  \"conditionType\": \"RECURRENCE\",\n  \"suppressionRecurrence\"\
      :\"FREQ=WEEKLY;BYDAY=MO,TU;BYHOUR=10\",\n  \"suppressionDuration\":\"PT1H\"\n\
      }\n\nExample 2: Daily at 21:30 UTC, with ten-minute duration\n\n{\n  \"conditionType\"\
      : \"RECURRENCE\",\n  \"suppressionRecurrence\":\"FREQ=DAILY;BYHOUR=21;BYMINUTE=30\"\
      ,\n  \"suppressionDuration\":\"PT10M\"\n}\n"
  RetrieveDimensionStatesDetails:
