basePath: /20180401
consumes:
- application/json
definitions:
  AggregatedDatapoint:
    description: 'A timestamp-value pair returned for the specified request.

      '
    properties:
      timestamp:
        description: 'The date and time associated with the value of this data point.
          Format defined by RFC3339.


          Example: `2023-02-01T01:02:29.600Z`

          '
        format: date-time
        type: string
      value:
        description: 'Numeric value of the metric.


          Example: `10.4`

          '
        format: double
        type: number
    required:
    - timestamp
    - value
    type: object
    x-example: "{\n  \"timestamp\": \"2023-03-10T22:20:00Z\",\n  \"value\": 10.4\n\
      }\n"
  Alarm:
    description: 'The properties that define an alarm.

      For information about alarms, see

      [Alarms Overview](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#AlarmsOverview).


      To use any of the API operations, you must be authorized in an IAM policy. If
      you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies
      to give users access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).


      For information about endpoints and signing API requests, see

      [About the API](/iaas/Content/API/Concepts/usingapi.htm).

      For information about available SDKs and tools, see

      [SDKS and Other Tools](/iaas/Content/API/Concepts/sdks.htm).

      '
    properties:
      alarmSummary: &id001
        description: "Customizable alarm summary (`alarmSummary` [alarm message parameter](/iaas/Content/Monitoring/alarm-message-format.htm)).\n\
          Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).\n\
          The alarm summary appears within the body of the alarm message and in responses\
          \ to \n[ListAlarmStatus](#/en/monitoring/latest/AlarmStatusSummary/ListAlarmsStatus)\
          \ \n[GetAlarmHistory](#/en/monitoring/latest/AlarmHistoryCollection/GetAlarmHistory)\
          \ and\n[RetrieveDimensionStates](#/en/monitoring/latest/AlarmDimensionStatesCollection/RetrieveDimensionStates).\n"
        type: string
      body: &id003
        description: 'The human-readable content of the delivered alarm notification.

          Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).

          Oracle recommends providing guidance

          to operators for resolving the alarm condition. Consider adding links to
          standard runbook

          practices. Avoid entering confidential information.


          Example: `High CPU usage alert. Follow runbook instructions for resolution.`

          '
        maxLength: 1000
        minLength: 1
        type: string
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the compartment containing the alarm.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags:
        additionalProperties:
          additionalProperties:
            description: 'An object that represents the value of the tag. Only String
              types are currently supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values
            scoped to a namespace

            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Usage of predefined tag keys. These predefined keys are scoped
          to namespaces.

          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      destinations:
        description: 'A list of destinations for alarm notifications.

          Each destination is represented by the [OCID](/iaas/Content/General/Concepts/identifiers.htm)

          of a related resource, such as a [topic](#/en/notification/latest/NotificationTopic).

          Supported destination services: Notifications, Streaming.

          Limit: One destination per supported destination service.

          '
        items:
          type: string
        minItems: 1
        type: array
      displayName:
        description: 'A user-friendly name for the alarm. It does not have to be unique,
          and it''s changeable.


          This value determines the title of each alarm notification.


          Example: `High CPU Utilization`

          '
        maxLength: 255
        minLength: 1
        type: string
      evaluationSlackDuration: &id007
        description: 'Customizable slack period to wait for metric ingestion before
          evaluating the alarm.

          Specify a string in ISO 8601 format (`PT10M` for ten minutes or `PT1H`

          for one hour). Minimum: PT3M. Maximum: PT2H. Default: PT3M.

          For more information about the slack period, see

          [About the Internal Reset Period](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#reset).

          '
        type: string
      freeformTags:
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined
          name, type or scope. Exists for cross-compatibility only.

          Example: `{"Department": "Finance"}`

          '
        type: object
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the alarm.

          '
        maxLength: 255
        minLength: 1
        type: string
      isEnabled:
        description: 'Whether the alarm is enabled.


          Example: `true`

          '
        type: boolean
      isNotificationsPerMetricDimensionEnabled:
        default: false
        description: 'When set to `true`, splits alarm notifications per metric stream.

          When set to `false`, groups alarm notifications across metric streams.

          '
        type: boolean
      lifecycleState:
        description: 'The current lifecycle state of the alarm.


          Example: `DELETED`

          '
        enum:
        - ACTIVE
        - DELETING
        - DELETED
        type: string
      messageFormat:
        default: RAW
        description: 'The format to use for alarm notifications. The formats are:

          * `RAW` - Raw JSON blob. Default value. When the `destinations` attribute
          specifies `Streaming`, all alarm notifications use this format.

          * `PRETTY_JSON`: JSON with new lines and indents. Available when the `destinations`
          attribute specifies `Notifications` only.

          * `ONS_OPTIMIZED`: Simplified, user-friendly layout. Available when the
          `destinations` attribute specifies `Notifications` only. Applies to Email
          subscription types only.

          '
        enum:
        - RAW
        - PRETTY_JSON
        - ONS_OPTIMIZED
        type: string
      metricCompartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the compartment containing the metric

          being evaluated by the alarm.

          '
        maxLength: 255
        minLength: 1
        type: string
      metricCompartmentIdInSubtree:
        description: 'When true, the alarm evaluates metrics from all compartments
          and subcompartments. The parameter can

          only be set to true when metricCompartmentId is the tenancy OCID (the tenancy
          is the root compartment).

          A true value requires the user to have tenancy-level permissions. If this
          requirement is not met,

          then the call is rejected. When false, the alarm evaluates metrics from
          only the compartment specified

          in metricCompartmentId. Default is false.


          Example: `true`

          '
        type: boolean
      namespace:
        description: 'The source service or application emitting the metric that is
          evaluated by the alarm.


          Example: `oci_computeagent`

          '
        maxLength: 255
        minLength: 1
        type: string
      notificationTitle: &id008
        description: 'Customizable notification title (`title` [alarm message parameter](/iaas/Content/Monitoring/alarm-message-format.htm)).

          Optionally include [dynamic variables](/iaas/Content/Monitoring/Tasks/update-alarm-dynamic-variables.htm).

          The notification title appears as the subject line in a formatted email
          message and as the title in a Slack message.

          '
        type: string
      notificationVersion: &id009
        description: 'The version of the alarm notification to be delivered. Allowed
          value: `1.X`

          The value must start with a number (up to four digits), followed by a period
          and an uppercase X.

          '
        type: string
      overrides: &id010
        description: "A set of overrides that control evaluations of the alarm. \n\
          \nEach override can specify values for query, severity, body, and pending\
          \ duration.\nWhen an alarm contains overrides, the Monitoring service evaluates\
          \ each override in order, beginning with the first override in the array\
          \ (index position `0`),\nand then evaluates the alarm's base values (`ruleName`\
          \ value of `BASE`).\n"
        items:
          $ref: '#/definitions/AlarmOverride'
        maxItems: 2
        type: array
      pendingDuration: &id004
        description: 'The period of time that the condition defined in the alarm must
          persist before the alarm state

          changes from "OK" to "FIRING". For example, a value of 5 minutes means that
          the

          alarm must persist in breaching the condition for five minutes before the
          alarm updates its

          state to "FIRING".


          The duration is specified as a string in ISO 8601 format (`PT10M` for ten
          minutes or `PT1H`

          for one hour). Minimum: PT1M. Maximum: PT24H. Default: PT1M.


          Under the default value of PT1M, the first evaluation that breaches the
          alarm updates the

          state to "FIRING".


          The alarm updates its status to "OK" when the breaching condition has been
          clear for

          the most recent minute.


          Example: `PT5M`

          '
        type: string
      query: &id005
        description: "The Monitoring Query Language (MQL) expression to evaluate for\
          \ the alarm. The Alarms feature of\nthe Monitoring service interprets results\
          \ for each returned time series as Boolean values,\nwhere zero represents\
          \ false and a non-zero value represents true. A true value means that the\
          \ trigger\nrule condition has been met. The query must specify a metric,\
          \ statistic, interval, and trigger\nrule (threshold or absence). Supported\
          \ values for interval depend on the specified time range. More\ninterval\
          \ values are supported for smaller time ranges. You can optionally\nspecify\
          \ dimensions and grouping functions.\nAlso, you can customize the \n[absence\
          \ detection period](/iaas/Content/Monitoring/Tasks/create-edit-alarm-query-absence-detection-period.htm).\n\
          Supported grouping functions: `grouping()`, `groupBy()`.\nFor information\
          \ about writing MQL expressions, see\n[Editing the MQL Expression for a\
          \ Query](/iaas/Content/Monitoring/Tasks/query-metric-mql.htm).\nFor details\
          \ about MQL, see\n[Monitoring Query Language (MQL) Reference](/iaas/Content/Monitoring/Reference/mql.htm).\n\
          For available dimensions, review the metric definition for the supported\
          \ service. See\n[Supported Services](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#SupportedServices).\n\
          \nExample of threshold alarm:\n\n  -----\n\n    CpuUtilization[1m]{availabilityDomain=\"\
          cumS:PHX-AD-1\"}.groupBy(availabilityDomain).percentile(0.9) > 85\n\n  -----\n\
          \nExample of absence alarm:\n\n  -----\n\n    CpuUtilization[1m]{availabilityDomain=\"\
          cumS:PHX-AD-1\"}.absent()\n\n  -----\nExample of absence alarm with custom\
          \ absence detection period of 20 hours:\n\n  -----\n    \n    CpuUtilization[1m]{availabilityDomain=\"\
          cumS:PHX-AD-1\"}.absent(20h)\n  \n  -----\n"
        maxLength: 1000
        minLength: 1
        type: string
      repeatNotificationDuration:
        description: 'The frequency for re-submitting alarm notifications, if the
          alarm keeps firing without

          interruption. Format defined by ISO 8601. For example, `PT4H` indicates
          four hours.

          As another example, `PT0M` indicates a repeat notification each time the
          alarm trigger condition is met,

          otherwise known as an event-based notification. For more information, see

          [Getting Event-Based Notifications for an Alarm](/iaas/Content/Monitoring/Tasks/update-alarm-event.htm).

          Minimum: PT0M. Maximum: P30D.

          '
        type: string
      resolution:
        description: 'The time between calculated aggregation windows for the alarm.
          Supported value: `1m`

          '
        type: string
      resourceGroup:
        description: 'Resource group to match for metric data retrieved by the alarm.
          A resource group is a custom string that you can match when retrieving custom
          metrics. Only one resource group can be applied per metric.

          A valid resourceGroup value starts with an alphabetical character and includes
          only alphanumeric characters, periods (.), underscores (_), hyphens (-),
          and dollar signs ($).


          Example: `frontend-fleet`

          '
        maxLength: 255
        minLength: 1
        type: string
      ruleName: &id002
        description: "Identifier of the alarm's base values for alarm evaluation,\
          \ for use when the alarm contains overrides. \nDefault value is `BASE`.\
          \ For information about alarm overrides, see [AlarmOverride](#/en/monitoring/latest/datatypes/AlarmOverride).\n"
        type: string
      severity: &id006
        description: 'The perceived type of response required when the alarm is in
          the "FIRING" state.


          Example: `CRITICAL`

          '
        enum:
        - CRITICAL
        - ERROR
        - WARNING
        - INFO
        type: string
      suppression:
        $ref: '#/definitions/Suppression'
        description: 'The configuration details for suppressing an alarm.

          '
      timeCreated:
        description: 'The date and time the alarm was created. Format defined by RFC3339.


          Example: `2023-02-01T01:02:29.600Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the alarm was last updated. Format defined
          by RFC3339.


          Example: `2023-02-03T01:02:29.600Z`

          '
        format: date-time
        type: string
    required:
    - id
    - displayName
    - compartmentId
    - metricCompartmentId
    - namespace
    - query
    - severity
    - destinations
    - isEnabled
    - lifecycleState
    - timeCreated
    - timeUpdated
    type: object
    x-example: "Sample 1: Single condition\n\n{\n  \"body\": \"CPU utilization has\
      \ reached high values.\",\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\"\
      ,\n  \"destinations\": [ \"<var>&lt;topic_OCID&gt;</var>\" ],\n  \"displayName\"\
      : \"High CPU Utilization\",\n  \"id\": \"ocid1.alarm.oc1..exampleuniqueID\"\
      ,\n  \"isEnabled\": true,\n  \"isNotificationsPerMetricDimensionEnabled\": true,\n\
      \  \"lifecycleState\": \"ACTIVE\",\n  \"messageFormat\": \"ONS_OPTIMIZED\",\n\
      \  \"metricCompartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"namespace\"\
      : \"oci_computeagent\",\n  \"pendingDuration\": \"PT5M\",\n  \"query\": \"CpuUtilization[1m]{availabilityDomain\
      \ = \\\"cumS:PHX-AD-1\"\\}.groupBy(availabilityDomain).percentile(0.9) > 85\"\
      ,\n  \"repeatNotificationDuration\": \"PT2H\",\n  \"severity\": \"WARNING\"\
      ,\n  \"suppression\":\n  {\n    \"description\": \"System Maintenance\",\n \
      \   \"timeSuppressFrom\": \"2023-02-04T05:00:00.600Z\",\n    \"timeSuppressUntil\"\
      : \"2023-02-04T07:00:00.600Z\"\n  },\n  \"timeCreated\": \"2023-02-01T01:02:29.600Z\"\
      ,\n  \"timeUpdated\": \"2023-02-03T01:02:29.600Z\"\n}\n\nSample 2: Multiple\
      \ conditions, with dynamic variables and a five-minute evaluation slack duration\n\
      \n{\n  \"alarmSummary\": \"test summary with severity = {{severity}} and query\
      \ = {{{query}}}\",\n  \"body\": \"{{severity}} alarm triggered because threshold\
      \ got breached due to {{metricValues}} at {{timestamp}}\",\n  \"compartmentId\"\
      : \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"destinations\": [ \"<var>&lt;topic_OCID&gt;</var>\"\
      \ ],\n  \"displayName\": \"High CPU Utilization\",\n  \"evaluationSlackDuration\"\
      : \"PT5M\",\n  \"id\": \"ocid1.alarm.oc1..exampleuniqueID\",\n  \"isEnabled\"\
      : true,\n  \"isNotificationsPerMetricDimensionEnabled\": true,\n  \"lifecycleState\"\
      : \"ACTIVE\",\n  \"messageFormat\": \"ONS_OPTIMIZED\",\n  \"metricCompartmentId\"\
      : \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"namespace\": \"oci_computeagent\"\
      ,\n  \"notificationTitle\": \"Sample title with severity {{severity}}\",\n \
      \ \"overrides\":\n    [\n      {\"body\": \"95% CPU utilization\", \"query\"\
      : \"CPUUtilization[1m].mean()>95\", \"severity\": \"CRITICAL\"},\n      {\"\
      body\": \"80% CPU utilization\", \"query\": \"CPUUtilization[1m].mean()>80\"\
      , \"severity\": \"WARNING\"}\n    ],\n  \"pendingDuration\": \"PT5M\",\n  \"\
      query\": \"CpuUtilization[1m]{availabilityDomain=\\\"cumS:PHX-AD-1\\\"}.groupBy(availabilityDomain).percentile(0.9)\
      \ > 85\",\n  \"repeatNotificationDuration\": \"PT2H\",\n  \"ruleName\": \"BASE\"\
      ,\n  \"severity\": \"INFO\",\n  \"timeCreated\": \"2023-02-01T01:02:29.600Z\"\
      ,\n  \"timeUpdated\": \"2023-02-03T01:02:29.600Z\"\n}\n\nSample 3: Event-based\
      \ alarm\n\n{\n  \"body\": \"Database instance terminated.\",\n  \"compartmentId\"\
      : \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"destinations\": [ \"<var>&lt;topic_OCID&gt;</var>\"\
      \ ],\n  \"displayName\": \"Database instance shutdown\",\n  \"id\": \"ocid1.alarm.oc1..exampleuniqueID\"\
      ,\n  \"isEnabled\": true,\n  \"isNotificationsPerMetricDimensionEnabled\": true,\n\
      \  \"lifecycleState\": \"ACTIVE\",\n  \"messageFormat\": \"ONS_OPTIMIZED\",\n\
      \  \"metricCompartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"namespace\"\
      : \"oci_database\",\n  \"pendingDuration\": \"PT1M\",\n  \"query\": \"DatabaseInstance.Shutdown[1m].groupBy(availabilityDomain).count()\
      \ > 0\",\n  \"repeatNotificationDuration\": \"PT0M\",\n  \"severity\": \"INFO\"\
      ,\n  \"timeCreated\": \"2025-01-01T01:02:29.600Z\",\n  \"timeUpdated\": \"2025-01-03T01:02:29.600Z\"\
      \n}\n"
  AlarmDimensionStatesCollection:
    description: "The list of current alarm state entries for each metric stream that\
      \ matches the filters. \n"
    properties:
      alarmId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the alarm to retrieve alarm state entries for.

          '
        type: string
      isEnabled:
        description: 'Whether the alarm is enabled.


          Example: `true`

          '
        type: boolean
      isNotificationsPerMetricDimensionEnabled:
        description: 'When set to `true`, splits alarm notifications per metric stream.

          When set to `false`, groups alarm notifications across metric streams.

          '
        type: boolean
      items:
        description: 'Array of alarm state entries.

          '
        items:
          $ref: '#/definitions/AlarmDimensionStatesEntry'
        type: array
    required:
    - alarmId
    - isEnabled
    - isNotificationsPerMetricDimensionEnabled
    - items
    type: object
    x-example: "{\n  \"alarmId\": \"ocid1.alarm.oc1..exampleuniqueID\",\n  \"isEnabled\"\
      : true,\n  \"isNotificationsPerMetricDimensionEnabled\": true,\n  \"items\"\
      :\n  [\n    {\n      \"alarmSummary\": \"Customizable alarm summary with dynamic\
      \ variables severity CRITICAL\",\n      \"dimensions\":\n        {\n       \
      \   \"availabilityDomain\": \"phx-ad-1\",\n          \"resourceId\": \"ocid1.instance.region1.phx.exampleuniqueID\"\
      \n        },\n      \"status\" : FIRING\n      \"timestamp\" : \"2021-12-01T01:02:30.600Z\"\
      \  \n        \n    }\n  ]\n}\n"
  AlarmDimensionStatesEntry:
    description: "A timestamped alarm state entry for a metric stream. \n"
    properties:
      alarmSummary: *id001
      dimensions:
        additionalProperties:
          maxLength: 255
          minLength: 1
          type: string
        description: 'Indicator of the metric stream associated with the alarm state
          entry. Includes one or more dimension key-value pairs.

          '
        type: object
      ruleName: *id002
      status:
        description: 'Transition state (status value) associated with the alarm state
          entry.


          Example: `FIRING`

          '
        enum:
        - FIRING
        - OK
        type: string
      timestamp:
        description: 'Transition time associated with the alarm state entry. Format
          defined by RFC3339.


          Example: `2022-02-01T01:02:29.600Z`

          '
        format: date-time
        type: string
    required:
    - alarmSummary
    - dimensions
    - status
    - ruleName
    - timestamp
    type: object
    x-example: "{\n  \"alarmSummary\": \"Customizable alarm summary with dynamic variables\
      \ severity CRITICAL\",\n  \"dimensions\": \"{\n     \"availabilityDomain\":\
      \ \"phx-ad-1\",\n     \"resourceId\": \"ocid1.instance.region1.phx.exampleuniqueID\"\
      \n   }\"\n  \"status\": \"Firing\",\n  \"ruleName\": \"BASE\",\n  \"timestamp\"\
      : \"2021-12-01T01:02:29.600Z\"\n}\n"
  AlarmHistoryCollection:
    description: 'The configuration details for retrieving alarm history.

      '
    properties:
      alarmId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of
          the alarm to retrieve history for.

          '
        type: string
      entries:
        description: 'The set of history entries retrieved for the alarm.

          '
        items:
          $ref: '#/definitions/AlarmHistoryEntry'
        type: array
      isEnabled:
        description: 'Whether the alarm is enabled.


          Example: `true`

          '
        type: boolean
    required:
    - alarmId
    - isEnabled
    - entries
    type: object
    x-example: "{\n  \"alarmId\": \"ocid1.alarm.oc1..exampleuniqueID\",\n  \"isEnabled\"\
      : true,\n  \"entries\":\n  [\n    {\n    \"alarmSummary\": \"Customizable alarm\
      \ summary with dynamic variables severity CRITICAL\",\n    \"summary\": \"Alarm\
      \ transitioned from OK to FIRING.\",\n    \"timestamp\": \"2023-02-01T01:02:29.600Z\"\
      \n    },\n    {\n    \"alarmSummary\": \"Customizable alarm summary with dynamic\
      \ variables severity CRITICAL\",\n    \"summary\": \"Alarm transitioned from\
      \ FIRING to OK.\",\n    \"timestamp\": \"2023-02-01T01:02:30.600Z\"\n    },\n\
      \    {\n    \"alarmSummary\": \"Customizable alarm summary with dynamic variables\
      \ severity CRITICAL\",\n    \"summary\": \"Alarm transitioned from OK to FIRING.\"\
      ,\n    \"timestamp\": \"2023-02-01T01:02:31.600Z\"\n    }\n  ]\n}\n"
  AlarmHistoryEntry:
    description: 'An alarm history entry indicating a description of the entry and
      the time that the entry occurred.

      If the entry corresponds to a state transition, such as OK to Firing, then the
      entry also includes a transition timestamp.

      '
    properties:
      alarmSummary: *id001
      summary:
        description: 'Description for this alarm history entry.


          Example 1 - alarm state history entry: `The alarm state is FIRING`


          Example 2 - alarm state transition history entry: `State transitioned from
          OK to Firing`

          '
        type: string
      timestamp:
        description: 'Timestamp for this alarm history entry. Format defined by RFC3339.


          Example: `2023-02-01T01:02:29.600Z`

          '
        format: date-time
        type: string
      timestampTriggered:
        description: 'Timestamp for the transition of the alarm state. For example,
          the time when the alarm transitioned from OK to Firing.

          Available for state transition entries only. Note: A three-minute lag for
          this value accounts for any late-arriving metrics.


          Example: `2023-02-01T0:59:00.789Z`

          '
        format: date-time
        type: string
    required:
    - alarmSummary
    - summary
    - timestamp
    type: object
    x-example: "{\n  \"alarmSummary\": \"Alarm is in a FIRING state; because 1 metric\
      \ meets the trigger rule: Example[1m].mean() > 1\",\n  \"summary\": \"State\
      \ transitioned from OK to Firing.\",\n  \"timestamp\": \"2023-02-01T01:02:29.600Z\"\
      ,\n  \"timestampTriggered\": \"2023-02-01T00:59:00.789Z\"\n}\n"
  AlarmOverride:
    description: 'Values to use for an independent evaluation of the alarm.

      You can specify values for query, severity, body, and pending duration.

      When an alarm contains overrides, the Monitoring service evaluates each override
      in order,

      beginning with the first override in the array (index position `0`),

      and then evaluates the alarm''s base values (`ruleName` value of `BASE`)

      '
    properties:
      body: *id003
      pendingDuration: *id004
      query: *id005
      ruleName:
        description: 'A user-friendly description for this alarm override. Must be
          unique across all `ruleName` values for the alarm.

          '
        type: string
      severity:
        description: 'The perceived severity of the alarm with regard to the affected
          system.

          '
        type: string
        x-obmcs-enumref: '#/definitions/Alarm/severity'
    type: object
    x-example: "{\n  \"body\": \"95% CPU utilization\",\n  \"pendingDuration\": \"\
      PT5M\",\n  \"query\": \"CPUUtilization[1m].mean()>95\",\n  \"ruleName\": \"\
      95\",\n  \"severity\": \"CRITICAL\"\n}\n"
  AlarmStatusSummary:
    description: 'A summary of properties for the specified alarm and its current
      evaluation status.

      For information about alarms, see

      [Alarms Overview](/iaas/Content/Monitoring/Concepts/monitoringoverview.htm#AlarmsOverview).


      To use any of the API operations, you must be authorized in an IAM policy. If
      you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies
      to give users access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).


      For information about endpoints and signing API requests, see

      [About the API](/iaas/Content/API/Concepts/usingapi.htm).

      For information about available SDKs and tools, see

      [SDKS and Other Tools](/iaas/Content/API/Concepts/sdks.htm).

      '
    properties:
      alarmSummary: *id001
      displayName:
