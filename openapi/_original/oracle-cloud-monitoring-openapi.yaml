          Example: `{"Department": "Finance"}`

          '
        type: object
      isEnabled:
        description: 'Whether the alarm is enabled.


          Example: `true`

          '
        type: boolean
      isNotificationsPerMetricDimensionEnabled:
        default: false
        description: 'When set to `true`, splits alarm notifications per metric stream.

          When set to `false`, groups alarm notifications across metric streams.

