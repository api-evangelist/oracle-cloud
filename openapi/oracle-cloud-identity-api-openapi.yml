              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the work request.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete multiple tag key definitions at the same time
      tags:
      - Identity
      x-example: "POST /20160918/tags/actions/bulkDelete/\nHost: identity.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"tagDefinitionIds\": [\n    \"ocid1.tagdefinition.oc1..<var>&lt;unique_ID_1&gt;</var>\",\n    \"ocid1.tagdefinition.oc1..<var>&lt;unique_ID_2&gt;</var>\",\n    \"ocid1.tagdefinition.oc1..<var>&lt;unique_ID_3&gt;</var>\"\n  ]\n}\n"
