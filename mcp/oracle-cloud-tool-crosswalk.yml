rest_only:
  note: >-
    The gap is enormous and is the headline finding of this crosswalk. The seven harvested
    first-party contracts expose 1,228 operations; the service-specific MCP servers expose roughly
    115 named tools, and all but a handful are reads. Every write path outside compute, networking,
    object storage and VCN/subnet creation — including the entire Kubernetes Engine surface
    (CreateCluster, CreateNodePool, DeleteCluster) and the entire Functions surface
    (CreateApplication, InvokeFunction) — has no named tool and is reachable only through the
    generic invoke_oci_api escape hatch.
  examples:
