authentication:
  stdio: OCI CLI profile / API signing key from ~/.oci/config (OCI_CONFIG_PROFILE env var)
  http: >-
    OAuth via an OCI IAM (IDCS) confidential application — IDCS_DOMAIN, IDCS_CLIENT_ID,
    IDCS_CLIENT_SECRET, IDCS_AUDIENCE; redirect URI ${ORACLE_MCP_BASE_URL}/auth/callback;
    default required scopes `openid profile email oci_mcp.<server>.invoke`.
probe:
  tools_list_attempted: false
  reason: >-
    No hosted endpoint exists to POST tools/list against. Tool names and descriptions below are
    read verbatim from Oracle's published per-server README tool tables; full inputSchemas would
    require running a server locally.
