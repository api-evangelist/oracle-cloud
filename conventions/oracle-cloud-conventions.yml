method: searched
source: >-
  https://docs.oracle.com/en-us/iaas/Content/API/Concepts/usingapi.htm and
  https://docs.oracle.com/en-us/iaas/Content/API/References/apierrors.htm, corroborated by the
  parameter and response declarations in openapi/_original/ (Oracle's own Swagger 2.0 contracts).
provider: Oracle Cloud Infrastructure
providerId: oracle-cloud
description: >-
  Cross-cutting runtime semantics of the Oracle Cloud Infrastructure control-plane APIs: request
  signing, retry tokens, optimistic concurrency, opaque-cursor pagination, request correlation,
  date-in-path versioning and the flat {code,message} error envelope.
authentication:
  style: request-signature
  scheme: >-
    Every OCI API request must be signed. Oracle uses HTTP request signing with an RSA API signing
    key (key id = tenancy/user/fingerprint), plus instance principals, resource principals, session
    tokens and workload identity as alternative credential sources.
  header: Authorization
  docs: https://docs.oracle.com/en-us/iaas/Content/API/Concepts/signingrequests.htm
  see_also: authentication/oracle-cloud-authentication.yml
  bearer_tokens: false
  oauth2: false
idempotency:
  supported: true
  header: opc-retry-token
  max_length: 64
  scope: per-operation
  retention: 24 hours
  retention_note: >-
    Verbatim from Oracle's contract: "Retry tokens expire after 24 hours, but can be invalidated
    before then due to conflicting operations (for example, if a resource has been deleted and
    purged from the system, then a retry of the original creation request may be rejected)."
  failure_code: InvalidatedRetryToken (HTTP 409)
  coverage:
    operations_total: 1268
    operations_accepting_opc_retry_token: 370
    by_spec:
      oracle-cloud-database-openapi.yaml: 160
      oracle-cloud-core-services-openapi.yaml: 154
      oracle-cloud-identity-openapi.yaml: 44
      oracle-cloud-notifications-openapi.yaml: 7
      oracle-cloud-monitoring-openapi.yaml: 3
      oracle-cloud-events-openapi.yaml: 2
      oracle-cloud-functions-openapi.yaml: 0
      oracle-cloud-kubernetes-engine-openapi.yaml: 0
      oracle-cloud-object-storage-openapi.yaml: 0
    note: >-
      Counted by inspecting the declared parameters of every operation in openapi/_original/.
      Coverage is not uniform: Database, Core Services and Identity accept a retry token on most
      create/mutate operations, while the Object Storage, Kubernetes Engine and Functions contracts
      declare the parameter in components but attach it to no operation. An agent must not assume
      a retry token is honoured service-wide.
  docs: https://docs.oracle.com/en-us/iaas/Content/API/Concepts/usingapi.htm
concurrency:
  optimistic_locking: true
  request_header: if-match
  response_header: etag
  failure_code: NoEtagMatch (HTTP 412)
  coverage:
    operations_accepting_if_match: 505
    by_spec:
      oracle-cloud-database-openapi.yaml: 211
      oracle-cloud-core-services-openapi.yaml: 168
      oracle-cloud-identity-openapi.yaml: 57
