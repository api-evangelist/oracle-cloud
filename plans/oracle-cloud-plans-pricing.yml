description: >-
  Oracle Cloud Infrastructure is consumption-priced per service, not tiered per API. The account
  types below are the real, published commercial plans; the per-service rates (per OCPU/ECPU-hour,
  per GB-month, per request, per GB egress) live in the Cloud Price List and the Cost Estimator.
  There is no per-API subscription and no request-priced API product — API access is included with
  the account and metered by the resources it provisions.
plan_count: 4
plans:
  - name: Oracle Cloud Free Tier — Free Trial
    price: 0
    currency: USD
    billing_period: one-time
    included_quota: US$300 of cloud credits, usable on all eligible OCI services
    duration: 30 days, or until the credits are consumed, whichever comes first
    limits: Full API access; resource limits are the Trial column of the service-limits table.
    source: https://www.oracle.com/cloud/free/
    verbatim: >-
      "Start with a US$300 cloud credit. You'll have 30 days to use it to test your applications on
      all OCI services, in addition to Always Free Services in your Free Tier account."
  - name: Always Free Services
    price: 0
    currency: USD
    billing_period: perpetual
    included_quota: >-
      A permanent monthly allocation across a named service list — HeatWave, AMD-based Compute,
      Arm-based Ampere A1 Compute, Block Volume, Object Storage, Archive Storage, Flexible Load
      Balancer, Flexible Network Load Balancer, Site-to-Site VPN, Autonomous Data Warehouse,
      Autonomous Transaction Processing, Autonomous JSON Database, NoSQL Database (Phoenix region
      only), APEX Application Development, Resource Manager (Terraform), Monitoring, Notifications,
      Logging, Application Performance Monitoring.
    duration: unlimited
    overage: Exceeding the monthly free amount requires an upgrade to Pay As You Go.
    source: https://www.oracle.com/cloud/free/
    verbatim: >-
      "Always Free services are available for an unlimited time. Some limitations apply. As new
      Always Free services become available, you will automatically be able to use those as well."
  - name: Pay As You Go
    price: metered
    currency: USD
    billing_period: monthly
    included_quota: The Always Free monthly amounts remain free; everything above them is metered.
    overage: Per-service published list rates — per OCPU/ECPU-hour, per GB-month, per request, per GB egress.
    limits: >-
      Service limits are lower than on Universal Credits (e.g. 5 API Gateways per region vs 50,
      3 load balancers vs 50, 30 TB block storage vs 100 TB) per the service-limits table.
    source: https://www.oracle.com/cloud/price-list.html
  - name: Oracle Universal Credits (annual / multi-year commitment)
    price: negotiated
    currency: USD
    billing_period: annual
    included_quota: A prepaid credit pool spendable across any OCI service.
    discount: Committed-use discounts; BYOL further reduces Oracle Database compute rates.
    limits: The highest default service limits of any account type.
    source: https://www.oracle.com/cloud/price-list.html
api_pricing:
  metered_per_call: false
  note: >-
    OCI does not charge per API call for the control plane. Cost follows the resources the calls
    create. The exceptions are data-plane services that are natively request-priced (Object Storage
    requests, Functions invocations, API Gateway requests), which are billed on their own service
    lines in the price list.
notes: >-
  Upgraded from method:generated to method:searched on 2026-08-29 after reading the live Free Tier
  page. Per-service unit rates were NOT transcribed — there are hundreds and they change; the Cloud
  Price List and Cost Estimator remain the authority and are linked above.
